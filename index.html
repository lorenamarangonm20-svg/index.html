async function exportParceriaExcel() {
  document.getElementById('exportMenu').style.display = 'none';
  const leadsParceria = leads.filter(l => l.temParceiro === 'Sim' && (l.parceiroNome || '').trim());
  if (leadsParceria.length === 0) { alert('Nenhum lead de parceria encontrado.'); return; }

  const nomesParceiros = [...new Set(leadsParceria.map(l => l.parceiroNome.trim()))];
  let parceiroAlvo = nomesParceiros[0];
  if (nomesParceiros.length > 1) {
    const escolha = prompt(`Encontrei leads de mais de um(a) parceiro(a):\n${nomesParceiros.map((n, i) => `${i + 1}. ${n}`).join('\n')}\n\nDigite o número do(a) parceiro(a) para gerar a planilha:`, '1');
    const idx = parseInt(escolha, 10) - 1;
    if (isNaN(idx) || !nomesParceiros[idx]) return;
    parceiroAlvo = nomesParceiros[idx];
  }

  const leadsDoParceiro = leadsParceria.filter(l => l.parceiroNome.trim() === parceiroAlvo);
  const cols = ['Nome', 'CPF', 'RG', 'Nacionalidade', 'Estado civil', 'Profissão', 'Sexo', 'Telefone', 'E-mail', 'Endereço completo', 'Cidade/UF', 'Banco', 'Tipo de problema', 'Valor aproximado (R$)', 'Documentos recebidos', 'Tags', 'Data de criação', 'Última atualização', 'Observações'];
  const numCols = cols.length;

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(('Parceria - ' + parceiroAlvo).slice(0, 31));
  ws.columns = cols.map(() => ({ width: 20 }));

  let r = 1;
  xlsTitleRow(ws, r, `🤝  Planilha de Parceria — ${parceiroAlvo}`, numCols); r++;
  xlsSubtitleRow(ws, r, `Gerado em ${new Date().toLocaleDateString('pt-BR')}  ·  Total de leads: ${leadsDoParceiro.length}`, numCols); r++;
  r++;

  xlsSectionRow(ws, r, 'RESUMO POR ETAPA', numCols); r++;
  STAGES.forEach(stage => {
    const count = leadsDoParceiro.filter(l => l.stage === stage).length;
    if (count > 0) {
      ws.getRow(r).getCell(1).value = stage;
      ws.getRow(r).getCell(2).value = count;
      ws.getRow(r).getCell(1).font = { name: 'Calibri', size: 10.5, color: { argb: XLS_INK } };
      ws.getRow(r).getCell(2).font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: XLS_NAVY } };
      r++;
    }
  });
  r += 2;

  STAGES.forEach(stage => {
    const doStage = leadsDoParceiro.filter(l => l.stage === stage);
    if (doStage.length === 0) return;
    xlsSectionRow(ws, r, `ETAPA: ${stage.toUpperCase()}  (${doStage.length})`, numCols); r++;
    const headerRowNum = r;
    cols.forEach((c, i) => { ws.getRow(headerRowNum).getCell(i + 1).value = c; });
    xlsHeaderRow(ws.getRow(headerRowNum), numCols); r++;
    const firstDataRow = r;
    doStage.forEach(l => {
      xlsSetRow(ws.getRow(r), [
        l.nome || '', l.cpf || '', l.rg || '', l.nacionalidade || '', l.estadoCivil || '', l.profissao || '',
        l.sexo || '', l.telefone || '', l.email || '', l.enderecoCompleto || '', l.cidadeUf || '',
        l.banco || '', l.tipoProblema || '', l.valorAproximado || '',
        (l.docs || []).join(', '), (l.tags || []).join(', '),
        l.dataCriacao ? new Date(l.dataCriacao).toLocaleDateString('pt-BR') : '',
        l.ultimaAtualizacao ? new Date(l.ultimaAtualizacao).toLocaleDateString('pt-BR') : '',
        formatarHistoricoObservacoes(l.notas),
      ]);
      r++;
    });
    xlsZebra(ws, firstDataRow, r - 1, numCols);
    r += 2;
  });

  const dateStr = new Date().toISOString().slice(0, 10);
  const safeNome = parceiroAlvo.replace(/[^a-zA-Z0-9]+/g, '-');
  await xlsDownload(wb, `parceria-${safeNome}-${dateStr}.xlsx`);
}

function escolherParceiroParaExport(tituloPrompt) {
  const nomesParceiros = [...new Set(leads.filter(l => l.temParceiro === 'Sim' && (l.parceiroNome || '').trim()).map(l => l.parceiroNome.trim()))];
  if (nomesParceiros.length === 0) return { cancelado: false, parceiro: null };

  const opcoes = ['Todos os leads (sem filtro de parceria)', ...nomesParceiros];
  const texto = opcoes.map((n, i) => `${i}. ${n}`).join('\n');
  const escolha = prompt(`${tituloPrompt}\n\n${texto}\n\nDigite o número da opção:`, '0');
  if (escolha === null) return { cancelado: true, parceiro: null };
  const idx = parseInt(escolha, 10);
  if (isNaN(idx) || !opcoes[idx]) { alert('Opção inválida. Tente novamente.'); return { cancelado: true, parceiro: null }; }
  return { cancelado: false, parceiro: idx === 0 ? null : opcoes[idx] };
}

async function exportLeadsProcessosDashboard() {
  document.getElementById('exportMenu').style.display = 'none';

  const escolha = escolherParceiroParaExport('Gerar esta planilha para todos os leads ou só de um(a) parceiro(a)?');
  if (escolha.cancelado) return;
  const parceiroAlvo = escolha.parceiro;

  let periodo = selectedMonthKey === 'todos'
    ? leads
    : leads.filter(l => monthKey(l.dataCriacao) === selectedMonthKey);
  if (parceiroAlvo) {
    periodo = periodo.filter(l => l.temParceiro === 'Sim' && (l.parceiroNome || '').trim() === parceiroAlvo);
  }

  if (periodo.length === 0) {
    alert(parceiroAlvo ? `Não há leads de ${parceiroAlvo} no período selecionado.` : 'Não há leads no período selecionado para exportar.');
    return;
  }

  const porEtapa = (arr) => [...arr].sort((a, b) => STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage) || a.nome.localeCompare(b.nome));
  const labelPeriodo = selectedMonthKey === 'todos' ? 'Todos os períodos' : monthLabel(selectedMonthKey);
  const labelParceiro = parceiroAlvo ? ` · Parceria: ${parceiroAlvo}` : '';

  const wb = new ExcelJS.Workbook();

  // ---- Aba 1: Leads e Etapa ----
  const wsLeads = wb.addWorksheet('Leads e Etapa', { views: [{ state: 'frozen', ySplit: 1 }] });
  wsLeads.columns = [
    { header: 'Nome do lead', width: 30 },
    { header: 'Etapa no funil', width: 30 },
    { header: 'Quem indicou', width: 22 },
    { header: 'Parte ré', width: 24 },
    { header: 'Observações', width: 46 },
  ];
  const listaLeads = porEtapa(periodo);
  listaLeads.forEach((l, i) => {
    const parteRe = (l.tipoProblema === 'Outro' && l.outroReu) ? l.outroReu : (l.banco || '');
    xlsSetRow(wsLeads.getRow(i + 2), [l.nome || '(sem nome)', l.stage || '', l.quemIndicou || '', parteRe, formatarHistoricoObservacoes(l.notas)]);
  });
  const wsLeadsLastRow = listaLeads.length + 1;
  xlsHeaderRow(wsLeads.getRow(1), 5);
  xlsZebra(wsLeads, 2, wsLeadsLastRow, 5);
  wsLeads.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: 5 } };
  for (let rr = 2; rr <= wsLeadsLastRow; rr++) {
    wsLeads.getRow(rr).getCell(5).alignment = { wrapText: true, vertical: 'top' };
  }

  // ---- Aba 2: Processos ----
  const comProcesso = porEtapa(periodo.filter(l => l.numeroProcesso || l.vara || l.andamento));
  const wsProc = wb.addWorksheet('Processos', { views: [{ state: 'frozen', ySplit: 1 }] });
  wsProc.columns = [{ header: 'Nome do lead', width: 30 }, { header: 'Parte ré', width: 24 }, { header: 'Número do processo', width: 26 }, { header: 'Vara', width: 28 }, { header: 'Andamento', width: 42 }];
  let wsProcLastRow;
  if (comProcesso.length > 0) {
    comProcesso.forEach((l, i) => {
      const parteRe = (l.tipoProblema === 'Outro' && l.outroReu) ? l.outroReu : (l.banco || '');
      xlsSetRow(wsProc.getRow(i + 2), [l.nome || '(sem nome)', parteRe, l.numeroProcesso || '', l.vara || '', l.andamento || '']);
    });
    wsProcLastRow = comProcesso.length + 1;
  } else {
    xlsSetRow(wsProc.getRow(2), ['—', '—', '—', '—', 'Nenhum lead deste filtro tem número de processo, vara ou andamento preenchido ainda.']);
    wsProcLastRow = 2;
  }
  xlsHeaderRow(wsProc.getRow(1), 5);
  xlsZebra(wsProc, 2, wsProcLastRow, 5);
  wsProc.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: 5 } };

  // ---- Aba 3: Dashboard ----
  const wsDash = wb.addWorksheet('Dashboard');
  wsDash.columns = [{ width: 36 }, { width: 18 }];
  let r = 1;
  xlsTitleRow(wsDash, r, `📊  Dashboard — ${labelPeriodo}${labelParceiro}`, 2); r++;
  xlsSubtitleRow(wsDash, r, `Gerado em ${new Date().toLocaleDateString('pt-BR')}  ·  Total de leads no período: ${periodo.length}`, 2); r++;
  r++;

  function tabelaResumo(titulo, pares) {
    xlsSectionRow(wsDash, r, titulo, 2); r++;
    const headerRowNum = r;
    wsDash.getRow(headerRowNum).getCell(1).value = 'Categoria';
    wsDash.getRow(headerRowNum).getCell(2).value = 'Quantidade';
    xlsHeaderRow(wsDash.getRow(headerRowNum), 2); r++;
    const firstDataRow = r;
    pares.forEach(([label, valor]) => {
      wsDash.getRow(r).getCell(1).value = label;
      wsDash.getRow(r).getCell(2).value = valor;
      wsDash.getRow(r).getCell(2).alignment = { horizontal: 'right' };
      r++;
    });
    if (r > firstDataRow) xlsZebra(wsDash, firstDataRow, r - 1, 2);
    r++;
  }

  tabelaResumo('LEADS POR ETAPA', STAGES.map(s => [s, periodo.filter(l => l.stage === s).length]).filter(([, n]) => n > 0));
  tabelaResumo('LEADS POR CANAL DE ORIGEM', [...new Set(periodo.map(l => l.canalOrigem).filter(Boolean))].map(c => [c, periodo.filter(l => l.canalOrigem === c).length]));
  tabelaResumo('LEADS POR TIPO DE PROBLEMA', [...new Set(periodo.map(l => l.tipoProblema).filter(Boolean))].map(p => [p, periodo.filter(l => l.tipoProblema === p).length]));

  const leadsParaEvolucao = parceiroAlvo ? leads.filter(l => l.temParceiro === 'Sim' && (l.parceiroNome || '').trim() === parceiroAlvo) : leads;
  tabelaResumo('EVOLUÇÃO MÊS A MÊS (todos os períodos)', getAvailableMonthKeys().slice().reverse().map(k => [monthLabel(k), leadsParaEvolucao.filter(l => monthKey(l.dataCriacao) === k).length]));

  if (!parceiroAlvo) {
    const comParceria = periodo.filter(l => l.temParceiro === 'Sim').length;
    tabelaResumo('PARCERIA', [['Em parceria', comParceria], ['Sem parceria', periodo.length - comParceria]]);
  }

  const dateStr = new Date().toISOString().slice(0, 10);
  const sufixoArquivo = parceiroAlvo ? `-${parceiroAlvo.replace(/[^a-zA-Z0-9]+/g, '-')}` : '';
  await xlsDownload(wb, `leads-processos-dashboard${sufixoArquivo}-${dateStr}.xlsx`);
}
function exportToPdf() {
  document.getElementById('exportMenu').style.display = 'none';
  const filtered = getFilteredLeads();
  if (filtered.length === 0) { alert('Não há leads para exportar.'); return; }

  const today = new Date().toLocaleDateString('pt-BR');
  let html = `
    <div class="print-header">
      <h1>CRM Comercial — Relatório de Leads</h1>
      <div class="sub">Lorena Marangon Mantovani — Advocacia &amp; Consultoria Jurídica · Gerado em ${today}</div>
    </div>`;

  STAGES.forEach(stage => {
    const stageLeads = filtered.filter(l => l.stage === stage);
    if (stageLeads.length === 0) return;
    html += `<div class="print-stage-title">${escapeHtml(stage)} (${stageLeads.length})</div>`;
    html += `<table class="print-table"><thead><tr>
      <th>Nome</th><th>Telefone</th><th>Tipo de problema</th><th>Banco</th><th>Tags</th><th>Atualizado</th>
    </tr></thead><tbody>`;
    stageLeads.forEach(l => {
      html += `<tr>
        <td>${escapeHtml(l.nome)}</td>
        <td>${escapeHtml(l.telefone)}</td>
        <td>${escapeHtml(l.tipoProblema)}</td>
        <td>${escapeHtml(l.banco)}</td>
        <td>${(l.tags || []).map(t => '#' + escapeHtml(t)).join(' ')}</td>
        <td>${l.ultimaAtualizacao ? new Date(l.ultimaAtualizacao).toLocaleDateString('pt-BR') : ''}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });

  const tituloOriginalPdf = document.title;
  document.title = 'Relatório de Leads';
  document.getElementById('printArea').innerHTML = html;
  window.print();
  setTimeout(() => { document.title = tituloOriginalPdf; }, 1000);
}

/* ---------- inicialização ---------- */
async function init() {
  if (!SUPABASE_URL || SUPABASE_URL.startsWith('COLE_AQUI') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) {
    renderSetupNeeded();
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) { await startApp(); } else { renderLogin(); }

  sb.auth.onAuthStateChange((event, newSession) => {
    if (event === 'SIGNED_OUT') { session = null; renderLogin(); }
  });
}

init();
</script>

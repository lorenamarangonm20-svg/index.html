<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Comercial — Lorena Marangon Mantovani</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #15253F;
    --navy-light: #1F3556;
    --gold: #C5A483;
    --gold-light: #F1EAE2;
    --cream: #F7F5F2;
    --text-dark: #2C2C2C;
    --border: #D9D2C7;
    --green: #1B7A3D;
    --green-light: #E4F1E8;
    --red: #A13A3A;
    --red-light: #F7E7E7;
    --white: #FFFFFF;
    --font: Calibri, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--cream); color: var(--text-dark); }

  /* ---------- header ---------- */
  header.topbar {
    background: var(--navy); color: white; padding: 14px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-bottom: 3px solid var(--gold);
  }
  header.topbar img.logo { width: 42px; height: 42px; border-radius: 50%; background: white; padding: 2px; }
  header.topbar .titles { margin-right: auto; }
  header.topbar h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.3px; }
  header.topbar .sub { font-size: 11.5px; color: var(--gold); margin-top: 1px; }
  .user-pill {
    font-size: 11.5px; color: white; background: rgba(255,255,255,0.1);
    padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px;
  }
  .btn {
    font-family: var(--font); border: none; border-radius: 6px; padding: 9px 16px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.5); }
  .btn-outline:hover { background: rgba(255,255,255,0.08); }
  .btn-ghost { background: none; color: var(--navy); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--gold-light); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { filter: brightness(1.1); }
  .btn-block { width: 100%; }
  input.search {
    font-family: var(--font); padding: 9px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
    color: white; font-size: 13.5px; min-width: 200px;
  }
  input.search::placeholder { color: rgba(255,255,255,0.6); }

  /* ---------- kpi strip ---------- */
  .month-tabs { display: flex; gap: 6px; padding: 10px 24px 0; flex-wrap: wrap; background: var(--white); align-items: center; }
  .month-tab {
    font-family: var(--font); border: 1px solid var(--border); background: var(--cream); color: var(--text-dark);
    border-radius: 20px 20px 0 0; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    border-bottom: none; white-space: nowrap;
  }
  .month-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .month-tab:hover:not(.active) { background: var(--gold-light); }
  .kpis { display: flex; gap: 12px; padding: 14px 24px; flex-wrap: wrap; background: var(--white); border-bottom: 1px solid var(--border); }
  .kpi { background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; min-width: 130px; }
  .kpi .num { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .kpi .label { font-size: 11px; color: #6b6459; margin-top: 2px; }

  /* ---------- board ---------- */
  .board-wrap { padding: 18px 24px 40px; overflow-x: auto; }
  .board { display: flex; gap: 14px; align-items: flex-start; min-width: max-content; }
  .column {
    background: var(--white); border: 1px solid var(--border); border-radius: 10px;
    width: 250px; flex-shrink: 0; display: flex; flex-direction: column;
    max-height: calc(100vh - 230px);
  }
  .column.dragover { outline: 2px dashed var(--gold); outline-offset: -2px; }
  .column-header {
    background: var(--navy); color: white; padding: 10px 12px; border-radius: 10px 10px 0 0;
    font-size: 12.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .column-header .count { background: var(--gold); color: var(--navy); border-radius: 20px; font-size: 11px; padding: 1px 8px; font-weight: 700; }
  .column-body { padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .column-empty { font-size: 11.5px; color: #9a9488; text-align: center; padding: 18px 6px; border: 1.5px dashed var(--border); border-radius: 8px; }

  /* ---------- card ---------- */
  .card {
    background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--gold);
    border-radius: 8px; padding: 10px 11px; cursor: grab; font-size: 12.5px;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .card:hover { box-shadow: 0 3px 10px rgba(21,37,63,0.12); transform: translateY(-1px); }
  .card.dragging { opacity: 0.4; }
  .card .name { font-weight: 700; color: var(--navy); font-size: 13px; margin-bottom: 3px; }
  .card .meta { color: #6b6459; font-size: 11px; margin-bottom: 2px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 9.5px; padding: 2px 7px; border-radius: 20px; background: var(--gold-light); color: var(--navy); font-weight: 600; white-space: nowrap; }
  .tag.urgent { background: var(--red-light); color: var(--red); }
  .card-stage-select { width: 100%; margin-top: 8px; font-family: var(--font); font-size: 10.5px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--border); color: var(--text-dark); background: var(--cream); }

  .empty-state { text-align: center; padding: 70px 20px; color: #6b6459; }
  .empty-state h2 { color: var(--navy); font-size: 20px; margin-bottom: 6px; }
  .empty-state p { font-size: 13.5px; margin-bottom: 18px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(21,37,63,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: white; border-radius: 12px; width: 100%; max-width: 620px; padding: 0; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-header { background: var(--navy); color: white; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
  .modal-header h2 { font-size: 16px; margin: 0; }
  .modal-header .close-x { cursor: pointer; font-size: 20px; background: none; border: none; color: white; line-height: 1; }
  .modal-body { padding: 20px 22px; max-height: 70vh; overflow-y: auto; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 11.5px; font-weight: 700; color: var(--navy); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; font-family: var(--font); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--cream); color: var(--text-dark); }
  .form-row textarea { min-height: 60px; resize: vertical; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid .full { grid-column: span 2; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-check { font-size: 11.5px; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; user-select: none; background: var(--cream); color: var(--text-dark); }
  .chip-check.active { background: var(--navy); color: white; border-color: var(--navy); }
  .chip-check.tag-active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; background: var(--cream); }
  .modal-footer .right { display: flex; gap: 8px; }
  .created-by { font-size: 10.5px; color: #9a9488; margin-top: 6px; }

  .note { font-size: 11px; color: #9a9488; text-align: center; padding: 10px 20px 22px; }

  /* ---------- login / setup screens ---------- */
  .center-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy); padding: 20px;
  }
  .login-card {
    background: white; border-radius: 14px; width: 100%; max-width: 380px;
    padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); text-align: center;
  }
  .login-card img.logo { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 14px; }
  .login-card h1 { font-size: 17px; color: var(--navy); margin: 0 0 2px; }
  .login-card .sub { font-size: 11.5px; color: var(--gold); margin-bottom: 22px; }
  .login-card .form-row { text-align: left; margin-bottom: 14px; }
  .login-card .form-row label { font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.3px; display:block; margin-bottom:4px; }
  .login-card input { width: 100%; font-family: var(--font); font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--cream); }
  .login-error { background: var(--red-light); color: var(--red); font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 14px; }

  .setup-card {
    background: white; border-radius: 14px; width: 100%; max-width: 640px;
    padding: 34px 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); text-align: left;
  }
  .setup-card h1 { color: var(--navy); font-size: 19px; margin-top: 0; }
  .setup-card ol { padding-left: 20px; font-size: 13.5px; line-height: 1.7; }
  .setup-card code {
    background: var(--gold-light); color: var(--navy); padding: 2px 6px; border-radius: 4px; font-size: 12.5px;
  }
  .setup-card pre {
    background: var(--navy); color: #E8E2D8; padding: 14px; border-radius: 8px; font-size: 11.5px;
    overflow-x: auto; line-height: 1.5;
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: span 1; }
    header.topbar { padding: 12px 14px; }
    input.search { min-width: 140px; flex: 1; }
  }

  /* ---------- exportação ---------- */
  .export-wrap { position: relative; }
  .export-menu {
    position: absolute; top: 110%; right: 0; background: white; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 30; min-width: 200px; overflow: hidden;
  }
  .export-menu button {
    display: block; width: 100%; text-align: left; padding: 11px 16px; background: none; border: none;
    font-family: var(--font); font-size: 13px; color: var(--text-dark); cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .export-menu button:last-child { border-bottom: none; }
  .export-menu button:hover { background: var(--gold-light); }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    .print-header { background: var(--navy) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; color: white; padding: 16px 20px; }
    .print-header h1 { margin: 0; font-size: 18px; }
    .print-header .sub { color: var(--gold) !important; -webkit-print-color-adjust: exact; font-size: 11px; margin-top: 2px; }
    .print-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 10px; }
    .print-table th { background: var(--navy) !important; -webkit-print-color-adjust: exact; color: white !important; text-align: left; padding: 6px 8px; }
    .print-table td { padding: 6px 8px; border-bottom: 1px solid #ddd; }
    .print-stage-title { background: var(--gold-light) !important; -webkit-print-color-adjust: exact; color: var(--navy); font-weight: bold; padding: 8px 10px; margin-top: 16px; font-size: 12px; }
  }
</style>
</head>

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysAgo(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (diff <= 0) return 'hoje';
  if (diff === 1) return 'há 1 dia';
  return 'há ' + diff + ' dias';
}

/* ---------- tela de login ---------- */
function renderLogin(errorMsg) {
  root.innerHTML = `
    <div class="center-screen">
      <div class="login-card">
        <img class="logo" src="data:image/png;base64,${LOGO_B64}" alt="Logo">
        <h1>CRM Comercial</h1>
        <div class="sub">Lorena Marangon Mantovani — Advocacia &amp; Consultoria Jurídica</div>
        ${errorMsg ? `<div class="login-error">${escapeHtml(errorMsg)}</div>` : ''}
        <div class="form-row">
          <label>E-mail</label>
          <input id="loginEmail" type="email" placeholder="seuemail@escritorio.com">
        </div>
        <div class="form-row">
          <label>Senha</label>
          <input id="loginPassword" type="password" placeholder="Sua senha">
        </div>
        <button class="btn btn-gold btn-block" id="btnLogin">Entrar</button>
        <div class="note" style="padding-top:16px;">Peça ao(à) administrador(a) do escritório para criar seu acesso no painel do Supabase.</div>
      </div>
    </div>`;

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { renderLogin('Preencha e-mail e senha.'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { renderLogin('E-mail ou senha incorretos. Tente novamente.'); return; }
  session = data.session;
  await startApp();
}

async function doLogout() {
  await sb.auth.signOut();
  session = null;
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  renderLogin();
}

/* ---------- app principal ---------- */
async function startApp() {
  renderAppShell();
  await loadLeads();
  if (!selectedMonthKey) selectedMonthKey = monthKey(new Date().toISOString());
  renderMonthTabs();
  renderBoard();
  renderKpis();
  subscribeRealtime();
}

function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('leads-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, async () => {
      await loadLeads();
      renderMonthTabs();
      renderBoard();
      renderKpis();
    })
    .subscribe();
}

async function loadLeads() {
  const { data, error } = await sb.from('leads').select('*').order('ultima_atualizacao', { ascending: false });
  if (error) { console.error(error); leads = []; return; }
  leads = (data || []).map(fromRow);
}

function fromRow(row) {
  return {
    id: row.id, nome: row.nome || '', telefone: row.telefone || '', cidadeUf: row.cidade_uf || '',
    canalOrigem: row.canal_origem || CANAIS[0], tipoBeneficio: row.tipo_beneficio || BENEFICIOS[0],
    faixaRenda: row.faixa_renda || '', tipoProblema: row.tipo_problema || PROBLEMAS[0],
    banco: row.banco || '', valorAproximado: row.valor_aproximado || '', stage: row.stage || STAGES[0],
    docs: row.docs || [], tags: row.tags || [], observacoes: row.observacoes || '',
    outroDescricao: row.outro_descricao || '', outroProblema: row.outro_problema || '', outroReu: row.outro_reu || '',
    temParceiro: row.tem_parceiro || 'Não', parceiroNome: row.parceiro_nome || '', parceiroContato: row.parceiro_contato || '', parceiroPercentual: row.parceiro_percentual || '',
    cpf: row.cpf || '', rg: row.rg || '', nacionalidade: row.nacionalidade || 'brasileira(o)', sexo: row.sexo || '',
    estadoCivil: row.estado_civil || '', profissao: row.profissao || '', enderecoCompleto: row.endereco_completo || '',
    email: row.email || '',
    temHonorariosIniciais: row.tem_honorarios_iniciais || 'Não', valorHonorariosIniciais: row.valor_honorarios_iniciais || '',
    motivoNaoConversao: row.motivo_nao_conversao || '', quemIndicou: row.quem_indicou || '',
    senhaGov: row.senha_gov || '', clienteNovoRecorrente: row.cliente_novo_recorrente || 'Novo',
    proximoFollowup: row.proximo_followup || '', notas: row.notas || [], driveFolderUrl: row.drive_folder_url || '',
    criadoPor: row.criado_por || '', dataCriacao: row.data_criacao, ultimaAtualizacao: row.ultima_atualizacao,
  };
}
function toRow(lead) {
  return {
    nome: lead.nome, telefone: lead.telefone, cidade_uf: lead.cidadeUf,
    canal_origem: lead.canalOrigem, tipo_beneficio: lead.tipoBeneficio, faixa_renda: lead.faixaRenda,
    tipo_problema: lead.tipoProblema, banco: lead.banco, valor_aproximado: lead.valorAproximado,
    stage: lead.stage, docs: lead.docs, tags: lead.tags, observacoes: lead.observacoes,
    outro_descricao: lead.outroDescricao || '', outro_problema: lead.outroProblema || '', outro_reu: lead.outroReu || '',
    tem_parceiro: lead.temParceiro || 'Não', parceiro_nome: lead.parceiroNome || '', parceiro_contato: lead.parceiroContato || '', parceiro_percentual: lead.parceiroPercentual || '',
    cpf: lead.cpf || '', rg: lead.rg || '', nacionalidade: lead.nacionalidade || '', sexo: lead.sexo || '',
    estado_civil: lead.estadoCivil || '', profissao: lead.profissao || '', endereco_completo: lead.enderecoCompleto || '',
    email: lead.email || '',
    tem_honorarios_iniciais: lead.temHonorariosIniciais || 'Não', valor_honorarios_iniciais: lead.valorHonorariosIniciais || '',
    motivo_nao_conversao: lead.motivoNaoConversao || '', quem_indicou: lead.quemIndicou || '',
    senha_gov: lead.senhaGov || '', cliente_novo_recorrente: lead.clienteNovoRecorrente || 'Novo',
    proximo_followup: lead.proximoFollowup || null, notas: lead.notas || [],
    criado_por: lead.criadoPor, ultima_atualizacao: new Date().toISOString(),

async function insertLead(lead) {
  const row = toRow(lead);
  row.criado_por = session.user.email;
  const { data, error } = await sb.from('leads').insert(row).select().single();
  if (error) { alert('Não foi possível salvar.\n\nErro técnico (envie este print para o suporte):\n' + (error.message || JSON.stringify(error))); console.error(error); return null; }
  return fromRow(data);
}
async function updateLead(lead) {
  const { error } = await sb.from('leads').update(toRow(lead)).eq('id', lead.id);
  if (error) { alert('Não foi possível salvar.\n\nErro técnico (envie este print para o suporte):\n' + (error.message || JSON.stringify(error))); console.error(error); return false; }
  return true;
}
async function deleteLeadRow(id) {
  const { error } = await sb.from('leads').delete().eq('id', id);
  if (error) { alert('Não foi possível excluir.\n\nErro técnico:\n' + (error.message || JSON.stringify(error))); console.error(error); return false; }
  return true;
}

/* ---------- KPIs ---------- */
/* ---------- meses / dashboards por período ---------- */
function monthKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
const MESES_PT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function monthLabel(key) {
  const [ano, mes] = key.split('-').map(Number);
  return `${MESES_PT[mes - 1]}/${ano}`;
}
function getAvailableMonthKeys() {
  const keys = new Set(leads.map(l => monthKey(l.dataCriacao)));
  keys.add(monthKey(new Date().toISOString()));
  return [...keys].sort().reverse();
}

function renderMonthTabs() {
  const el = document.getElementById('monthTabs');
  if (!el) return;
  const currentKey = monthKey(new Date().toISOString());
  const keys = getAvailableMonthKeys();
  el.innerHTML = keys.map(k => `
    <button type="button" class="month-tab ${k === selectedMonthKey ? 'active' : ''}" data-month="${k}">
      ${escapeHtml(monthLabel(k))}${k === currentKey ? ' (atual)' : ''}
    </button>`).join('') + `
    <button type="button" class="month-tab ${selectedMonthKey === 'todos' ? 'active' : ''}" data-month="todos">Todos os períodos</button>`;
  el.querySelectorAll('.month-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMonthKey = btn.dataset.month;
      renderMonthTabs();
      renderKpis();
    });
  });
}

function renderKpis() {
  const el = document.getElementById('kpiStrip');
  if (!el) return;
  const periodo = selectedMonthKey === 'todos'
    ? leads
    : leads.filter(l => monthKey(l.dataCriacao) === selectedMonthKey);

  const total = periodo.length;
  const parceria = periodo.filter(l => l.temParceiro === 'Sim').length;
  const urgentes = periodo.filter(l => (l.tags || []).some(t => t.startsWith('urgente'))).length;
  const semResposta = periodo.filter(l => (l.tags || []).includes('sem-resposta')).length;
  const encerrados = periodo.filter(l => l.stage === 'Encerrado').length;
  const label = selectedMonthKey === 'todos' ? 'Total (todos os períodos)' : 'Leads no período';
  const kpis = [[label, total], ['Leads de parceria', parceria], ['Urgentes', urgentes], ['Sem resposta', semResposta], ['Encerrados', encerrados]];
  el.innerHTML = kpis.map(([label, num]) => `<div class="kpi"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
}

function getFilteredLeads() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  return leads.filter(l => {
    if (!query) return true;
    return [l.nome, l.telefone, l.banco, l.tipoProblema].filter(Boolean).some(v => v.toLowerCase().includes(query));
  });
}

/* ---------- board ---------- */
function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;

  if (leads.length === 0) {
    board.innerHTML = `
      <div class="empty-state" style="width:100%;">
        <h2>Nenhum lead cadastrado ainda</h2>
        <p>Assim que um lead chegar pelo Instagram, TikTok ou WhatsApp, cadastre aqui para começar a acompanhar.</p>
        <button class="btn btn-gold" id="emptyBtnNew">+ Cadastrar primeiro lead</button>
      </div>`;
    document.getElementById('emptyBtnNew').addEventListener('click', () => openModal(null));
    return;
  }

  const filtered = getFilteredLeads();

  board.innerHTML = STAGES.map(stage => {
    const cardsInStage = filtered.filter(l => l.stage === stage);
    const cardsHtml = cardsInStage.length ? cardsInStage.map(cardHtml).join('') : '<div class="column-empty">Nenhum lead nesta etapa</div>';
    return `
      <div class="column" data-stage="${escapeHtml(stage)}">
        <div class="column-header"><span>${escapeHtml(stage)}</span><span class="count">${cardsInStage.length}</span></div>
        <div class="column-body" data-stage="${escapeHtml(stage)}">${cardsHtml}</div>
      </div>`;
  }).join('');

  attachBoardEvents();
}

function cardHtml(lead) {
  const tagsHtml = (lead.tags || []).map(t => `<span class="tag ${t.startsWith('urgente') ? 'urgent' : ''}">#${escapeHtml(t)}</span>`).join('');
  const parceiroTitle = lead.temParceiro === 'Sim' ? [lead.parceiroContato, lead.parceiroPercentual].filter(Boolean).join(' · ') : '';
  const parceiroHtml = lead.temParceiro === 'Sim' ? `<span class="tag" title="${escapeHtml(parceiroTitle)}" style="background:var(--gold); color:var(--navy);">🤝 Parceria${lead.parceiroNome ? ': ' + escapeHtml(lead.parceiroNome) : ''}</span>` : '';
  let followupHtml = '';
  if (lead.proximoFollowup) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dataFollowup = new Date(lead.proximoFollowup + 'T00:00:00');
    const diffDias = Math.round((dataFollowup - hoje) / 86400000);
    const dataFmt = dataFollowup.toLocaleDateString('pt-BR');
    if (diffDias < 0) followupHtml = `<span class="tag urgent">⏰ Follow-up atrasado (${dataFmt})</span>`;
    else if (diffDias === 0) followupHtml = `<span class="tag urgent">⏰ Follow-up hoje</span>`;
    else if (diffDias <= 3) followupHtml = `<span class="tag" style="background:var(--gold); color:var(--navy);">⏰ Follow-up em ${diffDias}d</span>`;
  }
  const stageOptions = STAGES.map(s => `<option value="${escapeHtml(s)}" ${s === lead.stage ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');
  const problemaLabel = (lead.tipoProblema === 'Outro' && lead.outroDescricao) ? `Outro: ${lead.outroDescricao}` : (lead.tipoProblema || '—');
  return `
    <div class="card" draggable="true" data-id="${lead.id}">
      <div class="name">${escapeHtml(lead.nome || '(sem nome)')}</div>
      <div class="meta">${escapeHtml(problemaLabel)}</div>
      <div class="meta">${escapeHtml(lead.banco || '')} ${lead.banco ? '·' : ''} ${daysAgo(lead.ultimaAtualizacao)}</div>
      <div class="tags">${followupHtml}${parceiroHtml}${tagsHtml}</div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <select class="card-stage-select" data-id="${lead.id}" style="flex:1; margin-top:0;">${stageOptions}</select>
        <button type="button" class="btn-followup-mini" data-id="${lead.id}" title="Follow-up e motivo de não conversão" style="flex-shrink:0; border:1px solid var(--border); background:var(--cream); border-radius:5px; padding:0 8px; cursor:pointer; font-size:13px;">📅</button>
      </div>
    </div>`;
}

function attachBoardEvents() {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => { if (e.target.classList.contains('card-stage-select') || e.target.classList.contains('btn-followup-mini')) return; openModal(card.dataset.id); });
    card.addEventListener('dragstart', (e) => { card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.id); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.btn-followup-mini').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openFollowupModal(btn.dataset.id); });
  });
  document.querySelectorAll('.card-stage-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      lead.stage = e.target.value;
      const ok = await updateLead(lead);
      if (ok) { await loadLeads(); renderMonthTabs(); renderBoard(); renderKpis(); }
    });
  });
  document.querySelectorAll('.column-body').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.closest('.column').classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.closest('.column').classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.closest('.column').classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      lead.stage = col.dataset.stage;
      const ok = await updateLead(lead);
      if (ok) { await loadLeads(); renderMonthTabs(); renderBoard(); renderKpis(); }
    });
  });
}

    lead.temParceiro = document.getElementById('f_temParceiro').value;
    lead.parceiroNome = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroNome').value.trim() : '';
    lead.parceiroContato = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroContato').value.trim() : '';

    lead.valorHonorariosIniciais = lead.temHonorariosIniciais === 'Sim' ? document.getElementById('f_valorHonorariosIniciais').value.trim() : '';
    lead.cpf = document.getElementById('f_cpf').value.trim();

function readFormIntoLead(baseLead) {

  const docsEls = document.querySelectorAll('#f_docs .chip-check.active');

    tipoProblema: val('f_tipoProblema') || document.getElementById('f_tipoProblema').value,
    banco: val('f_banco'), outroDescricao: document.getElementById('f_outroDescricao') ? val('f_outroDescricao') : (baseLead.outroDescricao || ''),
    outroProblema: document.getElementById('f_outroProblema') ? val('f_outroProblema') : (baseLead.outroProblema || ''),
    outroReu: document.getElementById('f_outroReu') ? val('f_outroReu') : (baseLead.outroReu || ''),
    cpf: val('f_cpf'), rg: val('f_rg'), nacionalidade: val('f_nacionalidade') || 'brasileira(o)',
    sexo: document.getElementById('f_sexo') ? document.getElementById('f_sexo').value : (baseLead.sexo || ''),
    estadoCivil: val('f_estadoCivil'), profissao: val('f_profissao'), enderecoCompleto: val('f_enderecoCompleto'),
    email: val('f_email'), valorAproximado: val('f_valorAproximado'),
    temParceiro: document.getElementById('f_temParceiro') ? document.getElementById('f_temParceiro').value : 'Não',
    parceiroNome: val('f_parceiroNome'), parceiroContato: val('f_parceiroContato'), parceiroPercentual: val('f_parceiroPercentual'),
    temHonorariosIniciais: document.getElementById('f_temHonorariosIniciais') ? document.getElementById('f_temHonorariosIniciais').value : 'Não',
    valorHonorariosIniciais: val('f_valorHonorariosIniciais'),
    motivoNaoConversao: baseLead.motivoNaoConversao || '',
    proximoFollowup: baseLead.proximoFollowup || '',
    quemIndicou: val('f_quemIndicou'),
    senhaGov: document.getElementById('f_senhaGov') ? document.getElementById('f_senhaGov').value : '',
    clienteNovoRecorrente: document.getElementById('f_clienteNovoRecorrente') ? document.getElementById('f_clienteNovoRecorrente').value : 'Novo',
    notas: baseLead.notas || [],

    tipoBeneficio: document.getElementById('f_tipoBeneficio') ? document.getElementById('f_tipoBeneficio').value : baseLead.tipoBeneficio,
    faixaRenda: val('f_faixaRenda'),

    tags: tagsEls.length ? Array.from(tagsEls).map(c => c.dataset.tag) : (baseLead.tags || []),
    observacoes: val('f_observacoes'),
  });
}

function valorPorExtenso(valorStr) {
  // aceita "1500", "1500,00", "1.500,50" etc. Retorna "mil e quinhentos reais" etc.
  if (!valorStr) return '';
  let limpo = String(valorStr).replace(/[^\d,.,]/g, '').trim();
  limpo = limpo.replace(/\.(?=\d{3}(,|$))/g, ''); // remove separador de milhar
  limpo = limpo.replace(',', '.');
  const numero = parseFloat(limpo);
  if (isNaN(numero)) return '';

  const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
  const dez_a_dezenove = ['dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

  function tresDigitos(n) {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    let partes = [];
    const c = Math.floor(n / 100), r = n % 100;
    if (c > 0) partes.push(centenas[c]);
    if (r > 0) {
      if (r < 10) partes.push(unidades[r]);
      else if (r < 20) partes.push(dez_a_dezenove[r - 10]);
      else {
        const d = Math.floor(r / 10), u = r % 10;
        partes.push(dezenas[d] + (u > 0 ? ' e ' + unidades[u] : ''));
      }
    }
    return partes.join(' e ');
  }

  function inteiroPorExtenso(n) {
    if (n === 0) return 'zero';
    const milhoes = Math.floor(n / 1000000);
    const milhares = Math.floor((n % 1000000) / 1000);
    const resto = n % 1000;
    let partes = [];
    if (milhoes > 0) partes.push(tresDigitos(milhoes) + (milhoes === 1 ? ' milhão' : ' milhões'));
    if (milhares > 0) partes.push((milhares === 1 ? 'mil' : tresDigitos(milhares) + ' mil'));
    if (resto > 0) partes.push(tresDigitos(resto));
    return partes.join(' e ');
  }

  const inteiro = Math.floor(numero);
  const centavos = Math.round((numero - inteiro) * 100);
  const usaMilhao = inteiro >= 1000000 && inteiro % 1000000 === 0;
  let texto = inteiroPorExtenso(inteiro) + (usaMilhao ? ' de' : '') + (inteiro === 1 ? ' real' : ' reais');
  if (centavos > 0) {
    texto += ' e ' + inteiroPorExtenso(centavos) + (centavos === 1 ? ' centavo' : ' centavos');
  }
  return texto;
}

function formatarReais(valorStr) {
  if (!valorStr) return '';
  let limpo = String(valorStr).replace(/[^\d,.]/g, '').trim();
  limpo = limpo.replace(/\.(?=\d{3}(,|$))/g, '');
  limpo = limpo.replace(',', '.');
  const numero = parseFloat(limpo);
  if (isNaN(numero)) return escapeHtml(valorStr);
  return numero.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function pKV(label, value) {
  if (!value) return '';
  return `<tr><td style="padding:5px 10px; font-size:11.5px; font-weight:bold; color:#15253F; width:38%; vertical-align:top; border-bottom:1px solid #eee;">${escapeHtml(label)}</td><td style="padding:5px 10px; font-size:12px; vertical-align:top; border-bottom:1px solid #eee;">${escapeHtml(String(value))}</td></tr>`;
}
function pSectionTitle(text) {
  return `<div style="background:#F1EAE2; color:#15253F; font-weight:bold; font-size:12px; padding:6px 10px; margin:16px 0 4px; border-radius:4px;">${escapeHtml(text)}</div>`;
}

function checarDadosMinimos(lead, campos) {
  const faltando = campos.filter(([key]) => !lead[key]);
  if (faltando.length > 0) {
    const nomes = faltando.map(([, label]) => label).join(', ');
    alert('Antes de gerar o documento, preencha: ' + nomes + '.\n\nEsses campos ficam na seção "Dados para geração de documentos", dentro da ficha do lead.');
    return false;
  }
  return true;
}

function downloadAsWord(contentHtml, filename) {
  const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${filename}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>body{font-family:Calibri, Arial, sans-serif;} @page{margin:2.5cm;}</style>
</head><body>${contentHtml}</body></html>`;
  const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[\\/:*?"<>|]/g, '') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function showDocPreview(tituloDoc, contentHtml, lead) {
  const root = document.getElementById('docPreviewRoot');
  const nomeArquivo = tituloDoc + (lead && lead.nome ? ' - ' + lead.nome : '');
  root.innerHTML = `
    <div class="overlay" id="docPreviewOverlay">
      <div class="modal" style="max-width: 760px;">
        <div class="modal-header">
          <h2>${escapeHtml(tituloDoc)} — revise antes de baixar</h2>
          <button class="close-x" id="docPreviewClose">&times;</button>
        </div>
        <div class="modal-body" style="max-height:65vh; background:#f0eee9;">
          <div id="docPreviewContent" style="background:white; border:1px solid var(--border); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            ${contentHtml}
          </div>
        </div>
        <div class="modal-footer">
          <div class="left" style="font-size:11px; color:#9a9488; max-width:220px;">Revise o conteúdo acima. Se precisar corrigir algo, feche e ajuste os dados do lead.</div>
          <div class="right">
            <button class="btn btn-ghost" id="docPreviewWord">💾 Baixar em Word (.doc)</button>
            <button class="btn btn-gold" id="docPreviewPrint">🖨️ Imprimir / Salvar PDF</button>
          </div>
        </div>
      </div>
    </div>`;

  const closePreview = () => { root.innerHTML = ''; };
  document.getElementById('docPreviewClose').addEventListener('click', closePreview);
  document.getElementById('docPreviewOverlay').addEventListener('click', (e) => { if (e.target.id === 'docPreviewOverlay') closePreview(); });
  document.getElementById('docPreviewWord').addEventListener('click', () => downloadAsWord(contentHtml, nomeArquivo));
  document.getElementById('docPreviewPrint').addEventListener('click', () => {
    const tituloOriginal = document.title;
    document.title = nomeArquivo;
    document.getElementById('printArea').innerHTML = contentHtml;
    window.print();
    setTimeout(() => { document.title = tituloOriginal; }, 1000);
  });
}

        ${pKV('Cliente novo ou recorrente', lead.clienteNovoRecorrente)}
        ${pKV('Tipo de benefício/renda', lead.tipoBeneficio)}
        ${pKV('Faixa de renda', lead.faixaRenda)}
        ${pKV('Tipo de problema', problemaTexto)}
        ${pKV('Detalhamento do problema', lead.outroProblema)}
        ${pKV('Réu/Parte contrária (caso "Outro")', lead.outroReu)}
        ${pKV('Banco/instituição envolvida', lead.banco)}
        ${pKV('Valor aproximado do prejuízo', lead.valorAproximado ? 'R$ ' + formatarReais(lead.valorAproximado) : '')}
        ${pKV('Etapa atual no funil', lead.stage)}
        ${pKV('Motivo de não conversão', lead.motivoNaoConversao)}
        ${pKV('Próximo follow-up', lead.proximoFollowup ? new Date(lead.proximoFollowup + 'T12:00:00').toLocaleDateString('pt-BR') : '')}
      </table>

      ${pSectionTitle('🔒 Acesso gov.br — CONFIDENCIAL')}
      <table style="width:100%; border-collapse:collapse;">
        ${pKV('Senha do gov.br', lead.senhaGov || 'Não informada')}
      </table>
      ${lead.senhaGov ? `<p style="font-size:10px; color:#A13A3A; margin-top:2px;">⚠ Documento confidencial — não compartilhe, não deixe impresso em local de acesso comum e descarte com segurança após o uso.</p>` : ''}

      ${pSectionTitle('Honorários')}
      <table style="width:100%; border-collapse:collapse;">
        ${pKV('Percentual de êxito', HONORARIOS_PERCENTUAL)}
        ${lead.temHonorariosIniciais === 'Sim' ? pKV('Honorários iniciais (além do êxito)', 'R$ ' + formatarReais(lead.valorHonorariosIniciais) + ' (' + valorPorExtenso(lead.valorHonorariosIniciais) + ')') : ''}
      </table>

      ${lead.temParceiro === 'Sim' ? `
      ${pSectionTitle('Atuação em Parceria')}
      <table style="width:100%; border-collapse:collapse;">
        ${pKV('Parceiro(a)/Escritório', lead.parceiroNome)}
        ${pKV('Contato do parceiro', lead.parceiroContato)}
        ${pKV('Divisão de honorários', lead.parceiroPercentual)}
      </table>
      ` : ''}

      ${pSectionTitle('Documentos Recebidos')}
      ${pJust(docsMarcados)}

      ${pSectionTitle('Tags')}
      ${pJust(tagsMarcadas)}

      ${(lead.notas && lead.notas.length > 0) ? pSectionTitle('Histórico de Observações') + [...lead.notas].sort((a,b) => new Date(b.data) - new Date(a.data)).map(n => `
        <div style="border-left:3px solid #C5A483; background:#F7F5F2; border-radius:4px; padding:6px 10px; margin-bottom:6px;">
          <div style="font-size:10px; font-weight:700; color:#15253F;">${escapeHtml(n.etapa || '—')} · ${n.data ? new Date(n.data).toLocaleDateString('pt-BR') : ''} ${n.autor ? '· ' + escapeHtml(n.autor) : ''}</div>
          <div style="font-size:11.5px; margin-top:2px;">${escapeHtml(n.texto)}</div>
        </div>`).join('') : ''}

      ${pSectionTitle('Controle Interno')}
      <table style="width:100%; border-collapse:collapse;">
        ${pKV('Cadastrado por', lead.criadoPor)}
        ${pKV('Data de criação', lead.dataCriacao ? new Date(lead.dataCriacao).toLocaleDateString('pt-BR') : '')}
        ${pKV('Última atualização', lead.ultimaAtualizacao ? new Date(lead.ultimaAtualizacao).toLocaleDateString('pt-BR') : '')}
        ${pKV('Pasta no Google Drive', lead.driveFolderUrl || '')}
      </table>
    `);
  }

  const tituloDoc = { procuracao: 'Procuração', hipossuficiencia: 'Declaração de Hipossuficiência', contrato: 'Contrato de Honorários', ficha: 'Ficha de Atendimento' }[tipo] || 'Documento';
  showDocPreview(tituloDoc, html, lead);
}

/* ---------- exportação ---------- */
function exportToExcel() {
  document.getElementById('exportMenu').style.display = 'none';
  const rows = getFilteredLeads().map(l => ({
    'Nome': l.nome, 'Telefone': l.telefone, 'Cidade/UF': l.cidadeUf,
    'Canal de origem': l.canalOrigem, 'Tipo de benefício': l.tipoBeneficio, 'Faixa de renda': l.faixaRenda,
    'Tipo de problema': l.tipoProblema, 'Banco': l.banco, 'Valor aproximado': l.valorAproximado,
    'Outro — descrição do processo': l.outroDescricao || '', 'Outro — problema': l.outroProblema || '', 'Outro — réu': l.outroReu || '',
    'Atuação em parceria': l.temParceiro || 'Não', 'Nome do parceiro': l.parceiroNome || '', 'Contato do parceiro': l.parceiroContato || '', 'Divisão de honorários': l.parceiroPercentual || '',
    'Quem indicou': l.quemIndicou || '', 'Cliente novo ou recorrente': l.clienteNovoRecorrente || '', 'Motivo de não conversão': l.motivoNaoConversao || '', 'Próximo follow-up': l.proximoFollowup || '',
    'Quantidade de observações registradas': (l.notas || []).length,
    'Etapa': l.stage, 'Documentos': (l.docs || []).join(', '), 'Tags': (l.tags || []).join(', '),
    'Observações': l.observacoes, 'Cadastrado por': l.criadoPor,
    'Data de criação': l.dataCriacao ? new Date(l.dataCriacao).toLocaleDateString('pt-BR') : '',
    'Última atualização': l.ultimaAtualizacao ? new Date(l.ultimaAtualizacao).toLocaleDateString('pt-BR') : '',
  }));
  if (rows.length === 0) { alert('Não há leads para exportar.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(() => ({ wch: 22 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Leads');
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `leads-crm-${dateStr}.xlsx`);
}

function exportToPdf() {
  document.getElementById('exportMenu').style.display = 'none';
  const filtered = getFilteredLeads();
  if (filtered.length === 0) { alert('Não há leads para exportar.'); return; }

  const today = new Date().toLocaleDateString('pt-BR');
  let html = `
    <div class="print-header">
      <h1>CRM Comercial — Relatório de Leads</h1>
      <div class="sub">Lorena Marangon Mantovani — Advocacia &amp; Consultoria Jurídica · Gerado em ${today}</div>
    </div>`;

  STAGES.forEach(stage => {
    const stageLeads = filtered.filter(l => l.stage === stage);
    if (stageLeads.length === 0) return;
    html += `<div class="print-stage-title">${escapeHtml(stage)} (${stageLeads.length})</div>`;
    html += `<table class="print-table"><thead><tr>
      <th>Nome</th><th>Telefone</th><th>Tipo de problema</th><th>Banco</th><th>Tags</th><th>Atualizado</th>
    </tr></thead><tbody>`;
    stageLeads.forEach(l => {
      html += `<tr>
        <td>${escapeHtml(l.nome)}</td>
        <td>${escapeHtml(l.telefone)}</td>
        <td>${escapeHtml(l.tipoProblema)}</td>
        <td>${escapeHtml(l.banco)}</td>
        <td>${(l.tags || []).map(t => '#' + escapeHtml(t)).join(' ')}</td>
        <td>${l.ultimaAtualizacao ? new Date(l.ultimaAtualizacao).toLocaleDateString('pt-BR') : ''}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });

  const tituloOriginalPdf = document.title;
  document.title = 'Relatório de Leads';
  document.getElementById('printArea').innerHTML = html;
  window.print();
  setTimeout(() => { document.title = tituloOriginalPdf; }, 1000);
}

/* ---------- inicialização ---------- */
async function init() {
  if (!SUPABASE_URL || SUPABASE_URL.startsWith('COLE_AQUI') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) {
    renderSetupNeeded();
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) { await startApp(); } else { renderLogin(); }

  sb.auth.onAuthStateChange((event, newSession) => {
    if (event === 'SIGNED_OUT') { session = null; renderLogin(); }
  });
}

init();
</script>

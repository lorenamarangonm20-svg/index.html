<style>
  :root {
    --navy: #15253F;
    --navy-deep: #0C1729;
    --navy-light: #1F3556;
    --gold: #C5A483;
    --gold-dark: #A9835E;
    --gold-light: #F1EAE2;
    --cream: #ECE9E4;
    --cream-soft: #F7F5F2;
    --paper: #FFFFFF;
    --text-dark: #2A2723;
    --text-muted: #7C7468;
    --border: #DDD5C8;
    --green: #3F6B4F;
    --green-light: #E7F0E8;
    --red: #9C4A3F;
    --red-light: #F6E8E5;
    --amber: #A9772E;
    --amber-light: #F5EBDA;
    --white: #FFFFFF;
    --font: 'Montserrat', -apple-system, 'Segoe UI', Arial, sans-serif;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --radius: 10px;
    --shadow-sm: 0 2px 8px rgba(21,37,63,0.06);
    --shadow-md: 0 8px 24px rgba(21,37,63,0.12);
    --shadow-lg: 0 20px 60px rgba(12,23,41,0.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--cream); color: var(--text-dark); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-serif); }
  :focus-visible { outline: 2px solid var(--gold-dark); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- header ---------- */
  header.topbar {
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: white; padding: 14px 26px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: relative;
    box-shadow: 0 2px 0 var(--gold), var(--shadow-md);
  }
  header.topbar::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(197,164,131,0.35) 1px, transparent 1px);
    background-size: 20px 20px; opacity: 0.10;
    overflow: hidden;
  }
  header.topbar > * { position: relative; z-index: 1; }
  header.topbar img.logo { width: 40px; height: auto; flex-shrink: 0; }
  header.topbar .titles { margin-right: auto; }
  header.topbar h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: 0.2px; font-family: var(--font-serif); }
  header.topbar .sub { font-size: 10px; color: var(--gold); margin-top: 1px; text-transform: uppercase; letter-spacing: 1.6px; font-weight: 600; }
  .user-pill {
    font-size: 11.5px; color: white; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    padding: 7px 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px;
  }
  .btn {
    font-family: var(--font); border: none; border-radius: 8px; padding: 10px 18px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.1px; cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--navy-deep); }
  .btn-gold:hover { filter: brightness(1.06); box-shadow: 0 4px 14px rgba(197,164,131,0.4); }
  .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.45); }
  .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.7); }
  .btn-ghost { background: var(--paper); color: var(--navy); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--gold-light); border-color: var(--gold); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { filter: brightness(1.1); }
  .btn-block { width: 100%; }
  input.search {
    font-family: var(--font); padding: 10px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08);
    color: white; font-size: 13px; min-width: 220px;
  }
  input.search::placeholder { color: rgba(255,255,255,0.55); }

  /* ---------- view toggle (quadro / dashboard) ---------- */
  .view-toggle { display: flex; gap: 3px; background: var(--cream); border: 1px solid var(--border); border-radius: 22px; padding: 3px; }
  .view-toggle button {
    font-family: var(--font); border: none; background: transparent; color: var(--text-muted);
    font-size: 12.5px; font-weight: 600; padding: 8px 18px; border-radius: 18px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .view-toggle button.active { background: var(--navy); color: white; box-shadow: var(--shadow-sm); }
  .view-toggle button:hover:not(.active) { color: var(--navy); }

  /* ---------- kpi strip ---------- */
  .month-tabs { display: flex; gap: 8px; padding: 16px 26px 0; flex-wrap: wrap; align-items: center; background: var(--cream); }
  .month-tab {
    font-family: var(--font); border: 1px solid var(--border); background: var(--paper); color: var(--text-dark);
    border-radius: 20px; padding: 8px 17px; font-size: 12px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .month-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .month-tab:hover:not(.active) { background: var(--gold-light); border-color: var(--gold); }
  .kpis { display: flex; gap: 14px; padding: 16px 26px; flex-wrap: wrap; background: var(--cream); }
  .kpi {
    background: var(--paper); border: 1px solid var(--border); border-top: 3px solid var(--gold);
    border-radius: var(--radius); padding: 14px 20px; min-width: 148px; flex: 1;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .kpi[data-filtro] { cursor: pointer; }
  .kpi[data-filtro]:hover { border-top-color: var(--navy); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .kpi .num { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; font-family: var(--font-serif); }
  .kpi .label { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }

  /* ---------- board ---------- */
  .board-wrap { padding: 20px 26px 44px; overflow-x: auto; }
  .board { display: flex; gap: 16px; align-items: flex-start; min-width: max-content; }
  .column {
    background: var(--cream-soft); border: 1px solid var(--border); border-radius: 12px;
    width: 258px; flex-shrink: 0; display: flex; flex-direction: column;
    max-height: calc(100vh - 250px); box-shadow: var(--shadow-sm);
  }
  .column.dragover { outline: 2px dashed var(--gold-dark); outline-offset: -2px; }
  .column-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: white; padding: 12px 14px; border-radius: 12px 12px 0 0;
    font-size: 12px; font-weight: 700; letter-spacing: 0.2px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .column-header .count { background: var(--gold); color: var(--navy-deep); border-radius: 20px; font-size: 11px; padding: 2px 9px; font-weight: 700; }
  .column-body { padding: 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .column-empty { font-size: 11.5px; color: var(--text-muted); text-align: center; padding: 20px 8px; border: 1.5px dashed var(--border); border-radius: 10px; }

  /* ---------- card ---------- */
  .card {
    background: var(--paper); border: 1px solid var(--border); border-left: 4px solid var(--gold);
    border-radius: 10px; padding: 12px 13px; cursor: grab; font-size: 12.5px;
    transition: box-shadow 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-left-color: var(--navy); }
  .card.dragging { opacity: 0.4; }
  .card .card-top { display: flex; align-items: flex-start; gap: 9px; }
  .card .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: var(--gold); font-size: 11px; font-weight: 700; font-family: var(--font-serif);
    display: flex; align-items: center; justify-content: center;
  }
  .card .name { font-weight: 700; color: var(--navy); font-size: 13px; margin-bottom: 2px; line-height: 1.3; }
  .card .meta { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: 9.5px; padding: 3px 9px; border-radius: 20px; background: var(--gold-light); color: var(--gold-dark); font-weight: 700; white-space: nowrap; letter-spacing: 0.2px; }
  .tag.urgent { background: var(--red-light); color: var(--red); }
  .card-stage-select { width: 100%; margin-top: 9px; font-family: var(--font); font-size: 10.5px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border); color: var(--text-dark); background: var(--cream-soft); }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 34px; margin-bottom: 10px; }
  .empty-state h2 { color: var(--navy); font-size: 21px; margin-bottom: 6px; font-weight: 600; }
  .empty-state p { font-size: 13.5px; margin-bottom: 20px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(12,23,41,0.6); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: var(--paper); border-radius: 14px; width: 100%; max-width: 640px; padding: 0; overflow: hidden; box-shadow: var(--shadow-lg); }
  .modal-header { background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
  .modal-header h2 { font-size: 18px; margin: 0; font-weight: 600; }
  .modal-header .close-x { cursor: pointer; font-size: 20px; background: none; border: none; color: white; line-height: 1; opacity: 0.85; }
  .modal-header .close-x:hover { opacity: 1; }
  .modal-body { padding: 22px 24px; max-height: 70vh; overflow-y: auto; background: var(--cream-soft); }
  .form-row { margin-bottom: 15px; }
  .form-row label { display: block; font-size: 11px; font-weight: 700; color: var(--navy); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; font-family: var(--font); font-size: 13.5px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--paper); color: var(--text-dark);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--gold-dark); box-shadow: 0 0 0 3px rgba(197,164,131,0.25);
  }
  .form-row textarea { min-height: 64px; resize: vertical; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .form-grid .full { grid-column: span 2; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-check { font-size: 11.5px; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; user-select: none; background: var(--paper); color: var(--text-dark); transition: background 0.15s ease, color 0.15s ease; }
  .chip-check.active { background: var(--navy); color: white; border-color: var(--navy); }
  .chip-check.tag-active { background: var(--gold); color: var(--navy-deep); border-color: var(--gold); }
  .modal-footer { padding: 15px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; background: var(--paper); }
  .modal-footer .right { display: flex; gap: 8px; flex-wrap: wrap; }
  .created-by { font-size: 10.5px; color: var(--text-muted); margin-top: 7px; }

  .note { font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px 20px 24px; }

  /* ---------- login / setup screens ---------- */
  .center-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%); padding: 20px;
    position: relative; overflow: hidden;
  }
  .center-screen::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(197,164,131,0.3) 1px, transparent 1px);
    background-size: 22px 22px; opacity: 0.12;
  }
  .login-card, .setup-card { position: relative; z-index: 1; }
  .login-card {
    background: var(--paper); border-radius: 16px; width: 100%; max-width: 380px;
    padding: 36px 30px; box-shadow: var(--shadow-lg); text-align: center;
  }
  .login-card img.logo { width: 56px; height: auto; margin-bottom: 16px; }
  .login-card h1 { font-size: 19px; color: var(--navy); margin: 0 0 3px; font-weight: 600; }
  .login-card .sub { font-size: 10.5px; color: var(--gold-dark); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; }
  .login-card .form-row { text-align: left; margin-bottom: 14px; }
  .login-card .form-row label { font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.3px; display:block; margin-bottom:5px; }
  .login-card input { width: 100%; font-family: var(--font); font-size: 14px; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--cream-soft); }
  .login-error { background: var(--red-light); color: var(--red); font-size: 12px; padding: 9px 11px; border-radius: 8px; margin-bottom: 14px; }

  .setup-card {
    background: var(--paper); border-radius: 16px; width: 100%; max-width: 640px;
    padding: 36px 38px; box-shadow: var(--shadow-lg); text-align: left;
  }
  .setup-card h1 { color: var(--navy); font-size: 20px; margin-top: 0; font-weight: 600; }
  .setup-card ol { padding-left: 20px; font-size: 13.5px; line-height: 1.7; }
  .setup-card code {
    background: var(--gold-light); color: var(--gold-dark); padding: 2px 7px; border-radius: 5px; font-size: 12.5px;
  }
  .setup-card pre {
    background: var(--navy-deep); color: #E8E2D8; padding: 16px; border-radius: 10px; font-size: 11.5px;
    overflow-x: auto; line-height: 1.5;
  }

  /* ---------- dashboard ---------- */
  .dashboard-wrap { padding: 22px 26px 48px; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 4px; }
  .dash-grid .span-2 { grid-column: span 2; }
  .dash-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; box-shadow: var(--shadow-sm);
  }
  .dash-card h3 { font-size: 15.5px; color: var(--navy); margin: 0 0 4px; font-weight: 600; }
  .dash-card .dash-sub { font-size: 11.5px; color: var(--text-muted); margin-bottom: 16px; }
  .dash-card canvas { max-height: 260px; }
  .chart-wrap { position: relative; height: 260px; width: 100%; }
  .map-wrap { position: relative; height: 420px; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  #mapaClientes { height: 100%; width: 100%; background: var(--cream-soft); }
  #mapaResumo { color: var(--gold-dark); font-weight: 600; }
  .custom-pin .pin-dot {
    width: 16px; height: 16px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--navy); border: 2px solid var(--gold);
    box-shadow: 0 2px 6px rgba(12,23,41,0.5);
  }
  .custom-cluster .cluster-badge {
    width: 34px; height: 34px; border-radius: 50%; background: var(--gold);
    color: var(--navy-deep); font-family: var(--font); font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--navy); box-shadow: 0 2px 8px rgba(12,23,41,0.35);
  }
  .leaflet-popup-content-wrapper { border-radius: 8px; font-family: var(--font); font-size: 12.5px; }
  .leaflet-popup-content-wrapper strong { color: var(--navy); }
  @media (max-width: 640px) { .map-wrap { height: 320px; } }
  .dash-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: 1fr; }
    .dash-grid .span-2 { grid-column: span 1; }
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: span 1; }
    header.topbar { padding: 12px 16px; }
    input.search { min-width: 140px; flex: 1; }
    .kpis { padding: 14px 16px; }
    .month-tabs { padding: 14px 16px 0; }
    .board-wrap { padding: 16px 16px 36px; }
    .dashboard-wrap { padding: 16px 16px 36px; }
  }

  /* ---------- exportação ---------- */
  .export-wrap { position: relative; }
  .export-menu {
    position: absolute; top: 112%; right: 0; background: var(--paper); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 30; min-width: 220px; overflow: hidden;
  }
  .export-menu button {
    display: block; width: 100%; text-align: left; padding: 12px 16px; background: none; border: none;
    font-family: var(--font); font-size: 13px; color: var(--text-dark); cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .export-menu button:last-child { border-bottom: none; }
  .export-menu button:hover { background: var(--gold-light); }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    .print-header { background: var(--navy) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; color: white; padding: 16px 20px; }
    .print-header h1 { margin: 0; font-size: 18px; }
    .print-header .sub { color: var(--gold) !important; -webkit-print-color-adjust: exact; font-size: 11px; margin-top: 2px; }
    .print-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 10px; }
    .print-table th { background: var(--navy) !important; -webkit-print-color-adjust: exact; color: white !important; text-align: left; padding: 6px 8px; }
    .print-table td { padding: 6px 8px; border-bottom: 1px solid #ddd; }
    .print-stage-title { background: var(--gold-light) !important; -webkit-print-color-adjust: exact; color: var(--navy); font-weight: bold; padding: 8px 10px; margin-top: 16px; font-size: 12px; }
  }
</style>

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysAgo(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (diff <= 0) return 'hoje';
  if (diff === 1) return 'há 1 dia';
  return 'há ' + diff + ' dias';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { renderLogin('Preencha e-mail e senha.'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { renderLogin('E-mail ou senha incorretos. Tente novamente.'); return; }
  session = data.session;
  await startApp();
}

async function doLogout() {
  await sb.auth.signOut();
  session = null;
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  renderLogin();
}

let activeView = 'quadro';
function setActiveView(view) {
  activeView = view;
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('boardWrap').style.display = view === 'quadro' ? '' : 'none';
  document.getElementById('dashboardWrap').style.display = view === 'dashboard' ? '' : 'none';
  if (view === 'dashboard') renderDashboard();
}

function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('leads-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, async () => {
      await loadLeads();
      renderMonthTabs();
      renderBoard();
      renderKpis();
    })
    .subscribe();
}

async function loadLeads() {
  const { data, error } = await sb.from('leads').select('*').order('ultima_atualizacao', { ascending: false });
  if (error) { console.error(error); leads = []; return; }
  leads = (data || []).map(fromRow);
}

function fromRow(row) {
  return {
    id: row.id, nome: row.nome || '', telefone: row.telefone || '', cidadeUf: row.cidade_uf || '',
    canalOrigem: row.canal_origem || CANAIS[0], tipoBeneficio: row.tipo_beneficio || BENEFICIOS[0],
    faixaRenda: row.faixa_renda || '', tipoProblema: row.tipo_problema || PROBLEMAS[0],
    banco: row.banco || '', valorAproximado: row.valor_aproximado || '', stage: row.stage || STAGES[0],
    numeroProcesso: row.numero_processo || '', vara: row.vara || '', andamento: row.andamento || '',
    docs: row.docs || [], tags: row.tags || [], observacoes: row.observacoes || '',
    outroDescricao: row.outro_descricao || '', outroProblema: row.outro_problema || '', outroReu: row.outro_reu || '',
    temParceiro: row.tem_parceiro || 'Não', parceiroNome: row.parceiro_nome || '', parceiroContato: row.parceiro_contato || '', parceiroPercentual: row.parceiro_percentual || '',
    parceiroOab: row.parceiro_oab || '', parceiroEndereco: row.parceiro_endereco || '',
    cpf: row.cpf || '', rg: row.rg || '', nacionalidade: row.nacionalidade || 'brasileira(o)', sexo: row.sexo || '',
    estadoCivil: row.estado_civil || '', profissao: row.profissao || '', enderecoCompleto: row.endereco_completo || '',
    email: row.email || '',
    temHonorariosIniciais: row.tem_honorarios_iniciais || 'Não', valorHonorariosIniciais: row.valor_honorarios_iniciais || '',
    motivoNaoConversao: row.motivo_nao_conversao || '', quemIndicou: row.quem_indicou || '',
    senhaGov: row.senha_gov || '', clienteNovoRecorrente: row.cliente_novo_recorrente || 'Novo',
    proximoFollowup: row.proximo_followup || '', notas: row.notas || [], driveFolderUrl: row.drive_folder_url || '',
    criadoPor: row.criado_por || '', dataCriacao: row.data_criacao, ultimaAtualizacao: row.ultima_atualizacao,
  };
}

    nome: lead.nome, telefone: lead.telefone, cidade_uf: lead.cidadeUf,
    canal_origem: lead.canalOrigem, tipo_beneficio: lead.tipoBeneficio, faixa_renda: lead.faixaRenda,
    tipo_problema: lead.tipoProblema, banco: lead.banco, valor_aproximado: lead.valorAproximado,
    stage: lead.stage, numero_processo: lead.numeroProcesso || '', vara: lead.vara || '', andamento: lead.andamento || '', docs: lead.docs, tags: lead.tags, observacoes: lead.observacoes,
    outro_descricao: lead.outroDescricao || '', outro_problema: lead.outroProblema || '', outro_reu: lead.outroReu || '',
    tem_parceiro: lead.temParceiro || 'Não', parceiro_nome: lead.parceiroNome || '', parceiro_contato: lead.parceiroContato || '', parceiro_percentual: lead.parceiroPercentual || '',

    criado_por: lead.criadoPor, ultima_atualizacao: new Date().toISOString(),
  };
}

async function insertLead(lead) {
  const row = toRow(lead);
  row.criado_por = session.user.email;
  const { data, error } = await sb.from('leads').insert(row).select().single();
  if (error) { alert('Não foi possível salvar.\n\nErro técnico (envie este print para o suporte):\n' + (error.message || JSON.stringify(error))); console.error(error); return null; }
  return fromRow(data);
}
async function updateLead(lead) {
  const { error } = await sb.from('leads').update(toRow(lead)).eq('id', lead.id);
  if (error) { alert('Não foi possível salvar.\n\nErro técnico (envie este print para o suporte):\n' + (error.message || JSON.stringify(error))); console.error(error); return false; }
  return true;
}
async function deleteLeadRow(id) {
  const { error } = await sb.from('leads').delete().eq('id', id);
  if (error) { alert('Não foi possível excluir.\n\nErro técnico:\n' + (error.message || JSON.stringify(error))); console.error(error); return false; }
  return true;
}

/* ---------- meses / dashboards por período ---------- */
function monthKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
const MESES_PT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function monthLabel(key) {
  const [ano, mes] = key.split('-').map(Number);
  return `${MESES_PT[mes - 1]}/${ano}`;
}
function getAvailableMonthKeys() {
  const keys = new Set(leads.map(l => monthKey(l.dataCriacao)));
  keys.add(monthKey(new Date().toISOString()));
  return [...keys].sort().reverse();
}

function renderMonthTabs() {
  const el = document.getElementById('monthTabs');
  if (!el) return;
  const currentKey = monthKey(new Date().toISOString());
  const keys = getAvailableMonthKeys();
  el.innerHTML = keys.map(k => `
    <button type="button" class="month-tab ${k === selectedMonthKey ? 'active' : ''}" data-month="${k}">
      ${escapeHtml(monthLabel(k))}${k === currentKey ? ' (atual)' : ''}
    </button>`).join('') + `
    <button type="button" class="month-tab ${selectedMonthKey === 'todos' ? 'active' : ''}" data-month="todos">Todos os períodos</button>`;
  el.querySelectorAll('.month-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMonthKey = btn.dataset.month;
      renderMonthTabs();
      renderKpis();
      if (activeView === 'dashboard') renderDashboard();
    });
  });
}

function renderKpis() {
  const el = document.getElementById('kpiStrip');
  if (!el) return;
  const periodo = selectedMonthKey === 'todos'
    ? leads
    : leads.filter(l => monthKey(l.dataCriacao) === selectedMonthKey);

  const total = periodo.length;
  const parceria = periodo.filter(l => l.temParceiro === 'Sim').length;
  const urgentes = periodo.filter(l => (l.tags || []).some(t => t.startsWith('urgente')));
  const semResposta = periodo.filter(l => (l.tags || []).includes('sem-resposta'));
  const encerrados = periodo.filter(l => l.stage === 'Encerrado');
  const label = selectedMonthKey === 'todos' ? 'Total (todos os períodos)' : 'Leads no período';

  const kpis = [
    { label, num: total, filtro: null },
    { label: 'Leads de parceria', num: parceria, filtro: 'parceria' },
    { label: 'Urgentes', num: urgentes.length, filtro: 'urgentes' },
    { label: 'Sem resposta', num: semResposta.length, filtro: 'sem-resposta' },
    { label: 'Encerrados', num: encerrados.length, filtro: 'encerrados' },
  ];
  el.innerHTML = kpis.map(k => `
    <div class="kpi" ${k.filtro ? `data-filtro="${k.filtro}" style="cursor:pointer;"` : ''}>
      <div class="num">${k.num}</div><div class="label">${escapeHtml(k.label)}</div>
    </div>`).join('');

  el.querySelectorAll('.kpi[data-filtro]').forEach(card => {
    card.addEventListener('click', () => openKpiListModal(card.dataset.filtro, periodo));
  });
}

function openKpiListModal(filtro, periodo) {
  const config = {
    'parceria': { titulo: '🤝 Leads de parceria', leads: periodo.filter(l => l.temParceiro === 'Sim'), detalhe: l => [l.parceiroNome, l.parceiroOab].filter(Boolean).join(' · ') },
    'urgentes': { titulo: '🔴 Leads urgentes', leads: periodo.filter(l => (l.tags || []).some(t => t.startsWith('urgente'))), detalhe: l => (l.tags || []).filter(t => t.startsWith('urgente')).map(t => '#' + t).join(' ') },
    'sem-resposta': { titulo: '⏳ Leads sem resposta', leads: periodo.filter(l => (l.tags || []).includes('sem-resposta')), detalhe: () => '' },
    'encerrados': { titulo: '✅ Leads encerrados', leads: periodo.filter(l => l.stage === 'Encerrado'), detalhe: l => daysAgo(l.ultimaAtualizacao) },
  }[filtro];
  if (!config) return;

  const modalRoot = document.getElementById('modalRoot');
  const linhas = config.leads.length
    ? config.leads.map(l => `
        <div class="kpi-list-row" data-id="${l.id}" style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer;">
          <div>
            <div style="font-weight:700; color:var(--navy); font-size:13.5px;">${escapeHtml(l.nome || '(sem nome)')}</div>
            <div style="font-size:11.5px; color:#6b6459;">${escapeHtml(l.stage)}${l.banco ? ' · ' + escapeHtml(l.banco) : ''}</div>
          </div>
          <div style="font-size:11px; color:var(--navy); text-align:right; max-width:200px;">${escapeHtml(config.detalhe(l))}</div>
        </div>`).join('')
    : `<div class="column-empty" style="margin:14px;">Nenhum lead encontrado neste filtro.</div>`;

  modalRoot.innerHTML = `
    <div class="overlay" id="overlayKpiList">
      <div class="modal" style="max-width:480px;">
        <div class="modal-header">
          <h2>${config.titulo} (${config.leads.length})</h2>
          <button class="close-x" id="closeKpiList">&times;</button>
        </div>
        <div class="modal-body" style="padding:0;">${linhas}</div>
        <div class="modal-footer"><div class="left"></div><div class="right"><button class="btn btn-ghost" id="cancelKpiList">Fechar</button></div></div>
      </div>
    </div>`;

  const close = () => { modalRoot.innerHTML = ''; };
  document.getElementById('closeKpiList').addEventListener('click', close);
  document.getElementById('cancelKpiList').addEventListener('click', close);
  document.getElementById('overlayKpiList').addEventListener('click', (e) => { if (e.target.id === 'overlayKpiList') close(); });
  modalRoot.querySelectorAll('.kpi-list-row').forEach(row => {
    row.addEventListener('click', () => { close(); openModal(row.dataset.id); });
  });
}

function getFilteredLeads() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  return leads.filter(l => {
    if (!query) return true;
    return [l.nome, l.telefone, l.banco, l.tipoProblema].filter(Boolean).some(v => v.toLowerCase().includes(query));
  });
}

function normalizarTexto_(str) {
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function parseCidadeUf_(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(.*?)[\/\-,]\s*([A-Za-z]{2})\s*$/);
  if (!m) return null;
  return { cidade: m[1].trim(), uf: m[2].toUpperCase() };
}

function geocodificarCidade(cidadeUfStr) {
  const parsed = parseCidadeUf_(cidadeUfStr);
  if (!parsed) return null;
  const chaveCidade = normalizarTexto_(parsed.cidade) + '-' + parsed.uf.toLowerCase();
  if (BRASIL_CIDADES[chaveCidade]) {
    return { coords: BRASIL_CIDADES[chaveCidade], precisao: 'cidade', cidade: parsed.cidade, uf: parsed.uf };
  }
  if (BRASIL_ESTADOS_CENTRO[parsed.uf.toLowerCase()]) {
    return { coords: BRASIL_ESTADOS_CENTRO[parsed.uf.toLowerCase()], precisao: 'estado', cidade: parsed.cidade, uf: parsed.uf };
  }
  return null;
}

let dashMap = null;
function renderMapaClientes() {
  if (dashMap) { dashMap.remove(); dashMap = null; }
  const mapEl = document.getElementById('mapaClientes');
  if (!mapEl) return;

  // O mapa sempre mostra todos os leads já cadastrados, independente do mês selecionado acima
  const geocodificados = leads
    .map(l => ({ lead: l, geo: geocodificarCidade(l.cidadeUf) }))
    .filter(x => x.geo);

  const resumoEl = document.getElementById('mapaResumo');
  if (geocodificados.length === 0) {
    if (resumoEl) resumoEl.textContent = 'Ainda não há cidades suficientes preenchidas para mostrar no mapa. Preencha o campo "Cidade/UF" dos leads (ex.: Juiz de Fora/MG).';
    mapEl.innerHTML = '';
    return;
  }

  const cidadesUnicas = new Set(geocodificados.map(x => x.geo.cidade.toLowerCase() + '-' + x.geo.uf));
  const estadosUnicos = new Set(geocodificados.map(x => x.geo.uf));
  if (resumoEl) {
    resumoEl.innerHTML = `🎉 Já atendemos <strong>${leads.length} cliente${leads.length === 1 ? '' : 's'}</strong> em <strong>${cidadesUnicas.size} cidade${cidadesUnicas.size === 1 ? '' : 's'}</strong> de <strong>${estadosUnicos.size} estado${estadosUnicos.size === 1 ? '' : 's'}</strong>! Continue assim, time 💪`;
  }

  dashMap = L.map('mapaClientes', { scrollWheelZoom: false }).setView([-14.235, -51.9253], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18,
  }).addTo(dashMap);

  const pinIcon = L.divIcon({
    className: 'custom-pin',
    html: '<div class="pin-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  });

  const cluster = L.markerClusterGroup({
    iconCreateFunction: (c) => L.divIcon({
      html: `<div class="cluster-badge">${c.getChildCount()}</div>`,
      className: 'custom-cluster',
      iconSize: [34, 34],
    }),
  });

  // Agrupa leads por coordenada, para mostrar todos os nomes num popup só
  const porCoord = {};
  geocodificados.forEach(({ lead, geo }) => {
    const key = geo.coords.join(',');
    if (!porCoord[key]) porCoord[key] = { coords: geo.coords, cidade: geo.cidade, uf: geo.uf, nomes: [] };
    porCoord[key].nomes.push(lead.nome || '(sem nome)');
  });

  Object.values(porCoord).forEach(grupo => {
    const marker = L.marker(grupo.coords, { icon: pinIcon });
    const listaNomes = grupo.nomes.slice(0, 8).map(n => `• ${escapeHtml(n)}`).join('<br>') + (grupo.nomes.length > 8 ? `<br>+ ${grupo.nomes.length - 8} outro(s)` : '');
    marker.bindPopup(`<strong>${escapeHtml(grupo.cidade)}/${escapeHtml(grupo.uf)}</strong><br>${grupo.nomes.length} cliente${grupo.nomes.length === 1 ? '' : 's'}<br><br>${listaNomes}`);
    cluster.addLayer(marker);
  });

  dashMap.addLayer(cluster);
  setTimeout(() => { if (dashMap) dashMap.invalidateSize(); }, 150);
}

function cardHtml(lead) {
  const tagsHtml = (lead.tags || []).map(t => `<span class="tag ${t.startsWith('urgente') ? 'urgent' : ''}">#${escapeHtml(t)}</span>`).join('');
  const parceiroTitle = lead.temParceiro === 'Sim' ? [lead.parceiroOab, lead.parceiroContato, lead.parceiroPercentual].filter(Boolean).join(' · ') : '';
  const parceiroHtml = lead.temParceiro === 'Sim' ? `<span class="tag" title="${escapeHtml(parceiroTitle)}" style="background:var(--gold); color:var(--navy);">🤝 Parceria${lead.parceiroNome ? ': ' + escapeHtml(lead.parceiroNome) : ''}</span>` : '';
  let followupHtml = '';
  if (lead.proximoFollowup) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dataFollowup = new Date(lead.proximoFollowup + 'T00:00:00');
    const diffDias = Math.round((dataFollowup - hoje) / 86400000);
    const dataFmt = dataFollowup.toLocaleDateString('pt-BR');
    if (diffDias < 0) followupHtml = `<span class="tag urgent">⏰ Follow-up atrasado (${dataFmt})</span>`;
    else if (diffDias === 0) followupHtml = `<span class="tag urgent">⏰ Follow-up hoje</span>`;
    else if (diffDias <= 3) followupHtml = `<span class="tag" style="background:var(--gold); color:var(--navy);">⏰ Follow-up em ${diffDias}d</span>`;
  }
  const stageOptions = STAGES.map(s => `<option value="${escapeHtml(s)}" ${s === lead.stage ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');
  const problemaLabel = (lead.tipoProblema === 'Outro' && lead.outroDescricao) ? `Outro: ${lead.outroDescricao}` : (lead.tipoProblema || '—');
  const iniciais = (lead.nome || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  return `
    <div class="card" draggable="true" data-id="${lead.id}">
      <div class="card-top">
        <div class="avatar">${escapeHtml(iniciais)}</div>
        <div style="flex:1; min-width:0;">
          <div class="name">${escapeHtml(lead.nome || '(sem nome)')}</div>
          <div class="meta">${escapeHtml(problemaLabel)}</div>
          <div class="meta">${escapeHtml(lead.banco || '')} ${lead.banco ? '·' : ''} ${daysAgo(lead.ultimaAtualizacao)}</div>
        </div>
      </div>
      <div class="tags">${followupHtml}${parceiroHtml}${tagsHtml}</div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <select class="card-stage-select" data-id="${lead.id}" style="flex:1; margin-top:0;">${stageOptions}</select>
        <button type="button" class="btn-followup-mini" data-id="${lead.id}" title="Follow-up e motivo de não conversão" style="flex-shrink:0; border:1px solid var(--border); background:var(--paper); border-radius:7px; padding:0 9px; cursor:pointer; font-size:13px;">📅</button>
      </div>
    </div>`;
}

function attachBoardEvents() {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => { if (e.target.classList.contains('card-stage-select') || e.target.classList.contains('btn-followup-mini')) return; openModal(card.dataset.id); });
    card.addEventListener('dragstart', (e) => { card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.id); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.btn-followup-mini').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openFollowupModal(btn.dataset.id); });
  });
  document.querySelectorAll('.card-stage-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      lead.stage = e.target.value;
      const ok = await updateLead(lead);
      if (ok) { await loadLeads(); renderMonthTabs(); renderBoard(); renderKpis(); }
    });
  });
  document.querySelectorAll('.column-body').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.closest('.column').classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.closest('.column').classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.closest('.column').classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      lead.stage = col.dataset.stage;
      const ok = await updateLead(lead);
      if (ok) { await loadLeads(); renderMonthTabs(); renderBoard(); renderKpis(); }
    });
  });
}

            <div class="form-row"><label>Nacionalidade</label><input id="f_nacionalidade" value="${escapeHtml(lead.nacionalidade || (lead.sexo === 'Feminino' ? 'brasileira' : lead.sexo === 'Masculino' ? 'brasileiro' : 'brasileira(o)'))}" placeholder="brasileira(o)"></div>
            <div class="form-row"><label>Estado civil</label><input id="f_estadoCivil" value="${escapeHtml(lead.estadoCivil || '')}" placeholder="Ex.: casado(a), solteiro(a)"></div>
            <div class="form-row"><label>Profissão</label><input id="f_profissao" value="${escapeHtml(lead.profissao || '')}" placeholder="Ex.: aposentado(a)"></div>

            <div class="form-row full" style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
              <label style="font-size:12.5px;">📞 Contato</label>
            </div>
            <div class="form-row"><label>Telefone/WhatsApp</label><input id="f_telefone" autocomplete="off" value="${escapeHtml(lead.telefone)}" placeholder="(xx) xxxxx-xxxx"></div>
            <div class="form-row"><label>E-mail</label><input id="f_email" autocomplete="off" value="${escapeHtml(lead.email || '')}" placeholder="email@exemplo.com"></div>
            <div class="form-row full"><label>Endereço residencial completo</label><input id="f_enderecoCompleto" autocomplete="off" value="${escapeHtml(lead.enderecoCompleto || '')}" placeholder="Rua, número, bairro, cidade/UF, CEP (residência do cliente)"></div>
            <div class="form-row"><label>Cidade/UF</label><input id="f_cidadeUf" value="${escapeHtml(lead.cidadeUf)}" placeholder="Cidade/UF"></div>
            <div class="form-row"><label>Canal de origem</label><select id="f_canalOrigem">${CANAIS.map(c => `<option ${c===lead.canalOrigem?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="form-row full" id="quemIndicouWrap" style="display:${lead.canalOrigem === 'Indicação' ? 'block' : 'none'};">
              <label>Quem indicou</label>
              <input id="f_quemIndicou" value="${escapeHtml(lead.quemIndicou || '')}" placeholder="Nome de quem indicou este lead">
            </div>

            <div class="form-row full" style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
              <label style="font-size:12.5px;">💼 Qualificação do lead</label>
            </div>
            <div class="form-row"><label>Cliente novo ou recorrente?</label><select id="f_clienteNovoRecorrente"><option ${lead.clienteNovoRecorrente!=='Recorrente'?'selected':''}>Novo</option><option ${lead.clienteNovoRecorrente==='Recorrente'?'selected':''}>Recorrente</option></select></div>
            <div class="form-row"><label>Tipo de benefício/renda</label><select id="f_tipoBeneficio">${BENEFICIOS.map(c => `<option ${c===lead.tipoBeneficio?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="form-row"><label>Faixa de renda (R$)</label><input id="f_faixaRenda" value="${escapeHtml(lead.faixaRenda)}" placeholder="Ex.: 1.500"></div>
            <div class="form-row"><label>Tipo de problema</label><select id="f_tipoProblema">${PROBLEMAS.map(c => `<option ${c===lead.tipoProblema?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="form-row"><label>Banco/instituição envolvida</label><input id="f_banco" value="${escapeHtml(lead.banco)}" placeholder="Nome do banco"></div>
            <div class="form-row full" id="outroWrap" style="display:${lead.tipoProblema === 'Outro' ? 'block' : 'none'};">
              <div style="background: var(--gold-light); border-radius: 8px; padding: 12px 14px; margin-bottom: 4px;">
                <label style="margin-bottom:8px;">Caso excepcional — fora de Direito Bancário</label>
                <div class="form-row">
                  <label>Do que se trata o processo (área/tipo de ação)</label>
                  <input id="f_outroDescricao" value="${escapeHtml(lead.outroDescricao || '')}" placeholder="Ex.: Ação trabalhista, inventário, divórcio...">
                </div>
                <div class="form-row">
                  <label>Qual é o problema</label>
                  <textarea id="f_outroProblema" placeholder="Descreva a situação do cliente">${escapeHtml(lead.outroProblema || '')}</textarea>
                </div>
                <div class="form-row" style="margin-bottom:0;">
                  <label>Nome do réu (parte contrária)</label>
                  <input id="f_outroReu" value="${escapeHtml(lead.outroReu || '')}" placeholder="Nome da pessoa ou empresa">
                </div>
              </div>
            </div>
            <div class="form-row"><label>Valor aproximado do prejuízo (R$)</label><input id="f_valorAproximado" value="${escapeHtml(lead.valorAproximado)}" placeholder="Ex.: 3.000"></div>

            <div class="form-row full" style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
              <label style="font-size:12.5px;">🤝 Parceria</label>
            </div>
            <div class="form-row"><label>Atuação em parceria?</label><select id="f_temParceiro"><option ${lead.temParceiro!=='Sim'?'selected':''}>Não</option><option ${lead.temParceiro==='Sim'?'selected':''}>Sim</option></select></div>
            <div class="form-row full" id="parceiroWrap" style="display:${lead.temParceiro === 'Sim' ? 'block' : 'none'};">
              <div style="background: var(--gold-light); border-radius: 8px; padding: 12px 14px; margin-bottom: 4px;">
                <label style="margin-bottom:8px;">Dados da parceria</label>
                <div class="form-row">
                  <label>Nome do(a) parceiro(a) / escritório</label>
                  <input id="f_parceiroNome" value="${escapeHtml(lead.parceiroNome || '')}" placeholder="Nome do advogado(a) ou escritório parceiro">
                </div>
                <div class="form-row">
                  <label>Número da OAB do(a) parceiro(a) <span style="font-weight:400; text-transform:none; letter-spacing:0;">(opcional)</span></label>
                  <input id="f_parceiroOab" value="${escapeHtml(lead.parceiroOab || '')}" placeholder="Ex.: OAB/MG 123.456">
                </div>
                <div class="form-row">
                  <label>Endereço completo do(a) parceiro(a) <span style="font-weight:400; text-transform:none; letter-spacing:0;">(opcional)</span></label>
                  <input id="f_parceiroEndereco" value="${escapeHtml(lead.parceiroEndereco || '')}" placeholder="Rua, número, bairro, cidade/UF">
                </div>
                <div class="form-row">
                  <label>Contato do parceiro (telefone/e-mail) <span style="font-weight:400; text-transform:none; letter-spacing:0;">— uso interno</span></label>
                  <input id="f_parceiroContato" value="${escapeHtml(lead.parceiroContato || '')}" placeholder="(xx) xxxxx-xxxx ou e-mail">
                </div>
                <div class="form-row" style="margin-bottom:0;">
                  <label>Percentual de divisão dos honorários <span style="font-weight:400; text-transform:none; letter-spacing:0;">— uso interno</span></label>
                  <input id="f_parceiroPercentual" value="${escapeHtml(lead.parceiroPercentual || '')}" placeholder="Ex.: 50% para cada parte">
                </div>
                <p style="font-size:11px; color:#6b6459; margin:10px 0 0;">ℹ️ Nome, OAB e endereço do(a) parceiro(a) aparecem automaticamente <strong>ao lado do seu nome</strong>, como coautora da representação, na <strong>Procuração</strong> e no <strong>Contrato de Honorários</strong> — não entram como cláusula separada. Só o nome é obrigatório para isso acontecer; OAB e endereço são opcionais e só entram no texto se você preencher. Contato e percentual de divisão ficam só aqui no CRM, para seu controle interno, e não aparecem nos documentos.</p>
              </div>
            </div>

            <div class="form-row full" style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
              <label style="font-size:12.5px;">📌 Funil e acompanhamento</label>
            </div>
            <div class="form-row"><label>Etapa do funil</label><select id="f_stage">${STAGES.map(s => `<option ${s===lead.stage?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
            <div class="form-row"><label>Número do processo <span style="font-weight:400; text-transform:none; letter-spacing:0;">(se já ajuizado)</span></label><input id="f_numeroProcesso" value="${escapeHtml(lead.numeroProcesso || '')}" placeholder="0000000-00.0000.0.00.0000"></div>
            <div class="form-row"><label>Vara</label><input id="f_vara" value="${escapeHtml(lead.vara || '')}" placeholder="Ex.: 2ª Vara Cível de Juiz de Fora"></div>
            <div class="form-row full"><label>Andamento processual</label><input id="f_andamento" value="${escapeHtml(lead.andamento || '')}" placeholder="Ex.: Aguardando contestação"></div>
            <div class="form-row full"><label>Documentos recebidos</label><div class="checklist" id="f_docs">${DOCS.map(d => `<span class="chip-check ${lead.docs && lead.docs.includes(d) ? 'active' : ''}" data-doc="${escapeHtml(d)}">${d}</span>`).join('')}</div></div>
            <div class="form-row full"><label>Tags</label><div class="checklist" id="f_tags">${TAGS.map(t => `<span class="chip-check ${lead.tags && lead.tags.includes(t) ? 'tag-active' : ''}" data-tag="${escapeHtml(t)}">#${t}</span>`).join('')}</div></div>
            <div class="form-row full">
              <label>📝 Histórico de Observações (acumula a cada etapa, nada se perde)</label>
              <div id="notasTimeline" style="max-height:220px; overflow-y:auto; margin-bottom:10px;"></div>
              <textarea id="f_novaNota" placeholder="Escreva uma nova observação — será registrada com a etapa e data de hoje..."></textarea>
              <button type="button" class="btn btn-ghost" id="btnAdicionarNota" style="margin-top:6px;">+ Adicionar observação</button>
              ${lead.criadoPor ? `<div class="created-by">Lead cadastrado por ${escapeHtml(lead.criadoPor)}</div>` : ''}
            </div>

            <div class="form-row full" style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
              <label style="font-size:12.5px;">🔒 Dados sensíveis e financeiro</label>
            </div>
            <div class="form-row full">
              <label>🔒 Senha do gov.br (informação sensível — só peça após a procuração assinada)</label>
              <div style="display:flex; gap:6px;">
                <input type="password" id="f_senhaGov" autocomplete="new-password" data-lpignore="true" data-1p-ignore value="${escapeHtml(lead.senhaGov || '')}" placeholder="Senha de acesso ao gov.br" style="flex:1;">
                <button type="button" class="btn btn-ghost" id="btnToggleSenhaGov" style="white-space:nowrap;">👁️ Mostrar</button>
              </div>
            </div>
            <div class="form-row"><label>Honorários iniciais, além do êxito?</label><select id="f_temHonorariosIniciais"><option ${lead.temHonorariosIniciais!=='Sim'?'selected':''}>Não</option><option ${lead.temHonorariosIniciais==='Sim'?'selected':''}>Sim</option></select></div>
            <div class="form-row" id="honorariosIniciaisWrap" style="display:${lead.temHonorariosIniciais === 'Sim' ? 'block' : 'none'};">
              <label>Valor dos honorários iniciais (R$)</label>
              <input id="f_valorHonorariosIniciais" value="${escapeHtml(lead.valorHonorariosIniciais || '')}" placeholder="Ex.: 500,00">
            </div>

            <div class="form-row full" style="margin-top: 4px;">
              <label>Gerar documentos (abre tela de revisão — Word ou PDF)</label>
              <div style="display:flex; flex-wrap:wrap; gap: 8px;">
                <button type="button" class="btn btn-ghost" id="btnGerarProcuracao">📜 Procuração</button>
                <button type="button" class="btn btn-ghost" id="btnGerarHipossuficiencia">📝 Declaração de Hipossuficiência</button>
                <button type="button" class="btn btn-ghost" id="btnGerarContrato">📑 Contrato de Honorários</button>
                <button type="button" class="btn btn-ghost" id="btnGerarFicha">🗂️ Ficha de Atendimento</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="left">${isNew ? '' : '<button class="btn btn-danger" id="btnDelete">Excluir lead</button>'}</div>
          <div class="right"><button class="btn btn-ghost" id="btnCancel">Cancelar</button><button class="btn btn-gold" id="btnSave">Salvar</button></div>
        </div>
      </div>
    </div>`;

  const selectedDocs = new Set(lead.docs || []);
  const selectedTags = new Set(lead.tags || []);

  // migração: se o lead antigo só tinha "observacoes" (texto único) e ainda não tem notas, converte em nota inicial
  if ((!lead.notas || lead.notas.length === 0) && lead.observacoes) {
    lead.notas = [{ data: lead.dataCriacao || new Date().toISOString(), etapa: lead.stage, texto: lead.observacoes, autor: lead.criadoPor || '—' }];
  }
  if (!lead.notas) lead.notas = [];

  function renderNotasTimeline() {
    const container = document.getElementById('notasTimeline');
    if (!lead.notas || lead.notas.length === 0) {
      container.innerHTML = '<div style="font-size:11.5px; color:#9a9488; padding:8px 0;">Nenhuma observação registrada ainda.</div>';
      return;
    }
    const ordenadas = [...lead.notas].sort((a, b) => new Date(b.data) - new Date(a.data));
    container.innerHTML = ordenadas.map(n => `
      <div style="border-left:3px solid var(--gold); background:var(--cream); border-radius:4px; padding:8px 10px; margin-bottom:6px;">
        <div style="font-size:10.5px; font-weight:700; color:var(--navy);">${escapeHtml(n.etapa || '—')} · ${n.data ? new Date(n.data).toLocaleDateString('pt-BR') : ''} ${n.autor ? '· ' + escapeHtml(n.autor) : ''}</div>
        <div style="font-size:12px; margin-top:2px; white-space:pre-wrap;">${escapeHtml(n.texto)}</div>
      </div>`).join('');
  }
  renderNotasTimeline();

  document.getElementById('btnAdicionarNota').addEventListener('click', () => {
    const textarea = document.getElementById('f_novaNota');
    const texto = textarea.value.trim();
    if (!texto) return;
    const etapaAtual = document.getElementById('f_stage').value;
    lead.notas.push({ data: new Date().toISOString(), etapa: etapaAtual, texto, autor: session.user.email });
    textarea.value = '';
    renderNotasTimeline();
  });

  document.getElementById('f_tipoProblema').addEventListener('change', (e) => {
    document.getElementById('outroWrap').style.display = e.target.value === 'Outro' ? 'block' : 'none';
  });
  document.getElementById('f_temParceiro').addEventListener('change', (e) => {
    document.getElementById('parceiroWrap').style.display = e.target.value === 'Sim' ? 'block' : 'none';
  });
  document.getElementById('f_temHonorariosIniciais').addEventListener('change', (e) => {
    document.getElementById('honorariosIniciaisWrap').style.display = e.target.value === 'Sim' ? 'block' : 'none';
  });
  document.getElementById('f_sexo').addEventListener('change', (e) => {
    const campoNacionalidade = document.getElementById('f_nacionalidade');
    const valorAtual = campoNacionalidade.value.trim();
    if (!valorAtual || valorAtual === 'brasileira(o)' || valorAtual === 'brasileira' || valorAtual === 'brasileiro') {
      campoNacionalidade.value = e.target.value === 'Feminino' ? 'brasileira' : e.target.value === 'Masculino' ? 'brasileiro' : 'brasileira(o)';
    }
  });
  document.getElementById('f_canalOrigem').addEventListener('change', (e) => {
    document.getElementById('quemIndicouWrap').style.display = e.target.value === 'Indicação' ? 'block' : 'none';
  });
  document.getElementById('btnToggleSenhaGov').addEventListener('click', () => {
    const input = document.getElementById('f_senhaGov');
    const btn = document.getElementById('btnToggleSenhaGov');
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈 Ocultar'; }
    else { input.type = 'password'; btn.textContent = '👁️ Mostrar'; }
  });
  document.querySelectorAll('#f_docs .chip-check').forEach(chip => chip.addEventListener('click', () => {
    const d = chip.dataset.doc;
    if (selectedDocs.has(d)) { selectedDocs.delete(d); chip.classList.remove('active'); } else { selectedDocs.add(d); chip.classList.add('active'); }
  }));
  document.querySelectorAll('#f_tags .chip-check').forEach(chip => chip.addEventListener('click', () => {
    const t = chip.dataset.tag;
    if (selectedTags.has(t)) { selectedTags.delete(t); chip.classList.remove('tag-active'); } else { selectedTags.add(t); chip.classList.add('tag-active'); }
  }));

  function gerarComAvisoParceria(tipo, docLabel) {
    const l = readFormIntoLead(lead);
    if (l.temParceiro === 'Sim' && !l.parceiroNome) {
      const continuar = confirm(`A parceria está marcada como "Sim", mas o nome do(a) parceiro(a) não foi preenchido. Sem o nome, ${docLabel} será gerado(a) apenas com o seu nome, sem mencionar a parceria.\n\nDeseja continuar mesmo assim?`);
      if (!continuar) return;
    }
    gerarDocumento(tipo, l);
  }
  document.getElementById('btnGerarProcuracao').addEventListener('click', () => gerarComAvisoParceria('procuracao', 'a procuração'));
  document.getElementById('btnGerarHipossuficiencia').addEventListener('click', () => gerarDocumento('hipossuficiencia', readFormIntoLead(lead)));
  document.getElementById('btnGerarContrato').addEventListener('click', () => gerarComAvisoParceria('contrato', 'o contrato'));
  document.getElementById('btnGerarFicha').addEventListener('click', () => gerarDocumento('ficha', readFormIntoLead(lead)));

  const close = () => { modalRoot.innerHTML = ''; };
  document.getElementById('closeX').addEventListener('click', close);
  document.getElementById('btnCancel').addEventListener('click', close);
  document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') close(); });

  if (!isNew) {
    document.getElementById('btnDelete').addEventListener('click', async () => {
      if (!confirm('Tem certeza que deseja excluir este lead? Essa ação não pode ser desfeita.')) return;
      const ok = await deleteLeadRow(lead.id);
      if (ok) { close(); await loadLeads(); renderMonthTabs(); renderBoard(); renderKpis(); }
    });
  }

  document.getElementById('btnSave').addEventListener('click', async () => {
    lead.nome = document.getElementById('f_nome').value.trim();
    if (!lead.nome) { alert('Preencha o nome do cliente antes de salvar.'); return; }
    lead.telefone = document.getElementById('f_telefone').value.trim();
    lead.cidadeUf = document.getElementById('f_cidadeUf').value.trim();
    lead.canalOrigem = document.getElementById('f_canalOrigem').value;
    lead.tipoBeneficio = document.getElementById('f_tipoBeneficio').value;
    lead.faixaRenda = document.getElementById('f_faixaRenda').value.trim();
    lead.tipoProblema = document.getElementById('f_tipoProblema').value;
    lead.banco = document.getElementById('f_banco').value.trim();
    lead.outroDescricao = lead.tipoProblema === 'Outro' ? document.getElementById('f_outroDescricao').value.trim() : '';
    lead.outroProblema = lead.tipoProblema === 'Outro' ? document.getElementById('f_outroProblema').value.trim() : '';
    lead.outroReu = lead.tipoProblema === 'Outro' ? document.getElementById('f_outroReu').value.trim() : '';
    lead.temParceiro = document.getElementById('f_temParceiro').value;
    lead.parceiroNome = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroNome').value.trim() : '';
    lead.parceiroOab = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroOab').value.trim() : '';
    lead.parceiroEndereco = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroEndereco').value.trim() : '';
    lead.parceiroContato = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroContato').value.trim() : '';
    lead.parceiroPercentual = lead.temParceiro === 'Sim' ? document.getElementById('f_parceiroPercentual').value.trim() : '';
    lead.temHonorariosIniciais = document.getElementById('f_temHonorariosIniciais').value;
    lead.valorHonorariosIniciais = lead.temHonorariosIniciais === 'Sim' ? document.getElementById('f_valorHonorariosIniciais').value.trim() : '';
    lead.cpf = document.getElementById('f_cpf').value.trim();
    lead.rg = document.getElementById('f_rg').value.trim();
    lead.sexo = document.getElementById('f_sexo').value;
    lead.nacionalidade = document.getElementById('f_nacionalidade').value.trim();
    lead.estadoCivil = document.getElementById('f_estadoCivil').value.trim();
    lead.profissao = document.getElementById('f_profissao').value.trim();
    lead.enderecoCompleto = document.getElementById('f_enderecoCompleto').value.trim();
    lead.email = document.getElementById('f_email').value.trim();
    lead.valorAproximado = document.getElementById('f_valorAproximado').value.trim();
    lead.stage = document.getElementById('f_stage').value;
    lead.numeroProcesso = document.getElementById('f_numeroProcesso').value.trim();
    lead.vara = document.getElementById('f_vara').value.trim();
    lead.andamento = document.getElementById('f_andamento').value.trim();
    lead.docs = Array.from(selectedDocs);
    lead.tags = Array.from(selectedTags);
    // motivoNaoConversao e proximoFollowup agora são editados pelo card próprio (botão 📅 no card do quadro)
    lead.quemIndicou = lead.canalOrigem === 'Indicação' ? document.getElementById('f_quemIndicou').value.trim() : '';
    lead.senhaGov = document.getElementById('f_senhaGov').value;
    lead.clienteNovoRecorrente = document.getElementById('f_clienteNovoRecorrente').value;
    // lead.notas já foi atualizado diretamente pelo botão "Adicionar observação"

    const ok = isNew ? await insertLead(lead) : await updateLead(lead);
    if (!ok) return;
    close();
    await loadLeads();
    renderBoard();
    renderKpis();
  });
}

/* ---------- geração de documentos ---------- */
function readFormIntoLead(baseLead) {
  // lê os valores atuais do formulário (funciona mesmo em lead novo, ainda não salvo)
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const docsEls = document.querySelectorAll('#f_docs .chip-check.active');
  const tagsEls = document.querySelectorAll('#f_tags .chip-check.tag-active');
  return Object.assign({}, baseLead, {
    nome: val('f_nome'), telefone: val('f_telefone'), cidadeUf: val('f_cidadeUf'),
    tipoProblema: val('f_tipoProblema') || document.getElementById('f_tipoProblema').value,
    banco: val('f_banco'), outroDescricao: document.getElementById('f_outroDescricao') ? val('f_outroDescricao') : (baseLead.outroDescricao || ''),
    outroProblema: document.getElementById('f_outroProblema') ? val('f_outroProblema') : (baseLead.outroProblema || ''),
    outroReu: document.getElementById('f_outroReu') ? val('f_outroReu') : (baseLead.outroReu || ''),
    cpf: val('f_cpf'), rg: val('f_rg'), nacionalidade: val('f_nacionalidade') || 'brasileira(o)',
    sexo: document.getElementById('f_sexo') ? document.getElementById('f_sexo').value : (baseLead.sexo || ''),
    estadoCivil: val('f_estadoCivil'), profissao: val('f_profissao'), enderecoCompleto: val('f_enderecoCompleto'),
    email: val('f_email'), valorAproximado: val('f_valorAproximado'),
    temParceiro: document.getElementById('f_temParceiro') ? document.getElementById('f_temParceiro').value : 'Não',
    parceiroNome: val('f_parceiroNome'), parceiroContato: val('f_parceiroContato'), parceiroPercentual: val('f_parceiroPercentual'),

function valorPorExtenso(valorStr) {
  // aceita "1500", "1500,00", "1.500,50" etc. Retorna "mil e quinhentos reais" etc.
  if (!valorStr) return '';
  let limpo = String(valorStr).replace(/[^\d,.,]/g, '').trim();
  limpo = limpo.replace(/\.(?=\d{3}(,|$))/g, ''); // remove separador de milhar
  limpo = limpo.replace(',', '.');
  const numero = parseFloat(limpo);
  if (isNaN(numero)) return '';

  const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
  const dez_a_dezenove = ['dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

  function tresDigitos(n) {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    let partes = [];
    const c = Math.floor(n / 100), r = n % 100;
    if (c > 0) partes.push(centenas[c]);
    if (r > 0) {
      if (r < 10) partes.push(unidades[r]);
      else if (r < 20) partes.push(dez_a_dezenove[r - 10]);
      else {
        const d = Math.floor(r / 10), u = r % 10;
        partes.push(dezenas[d] + (u > 0 ? ' e ' + unidades[u] : ''));
      }
    }
    return partes.join(' e ');
  }

  function inteiroPorExtenso(n) {
    if (n === 0) return 'zero';
    const milhoes = Math.floor(n / 1000000);
    const milhares = Math.floor((n % 1000000) / 1000);
    const resto = n % 1000;
    let partes = [];
    if (milhoes > 0) partes.push(tresDigitos(milhoes) + (milhoes === 1 ? ' milhão' : ' milhões'));
    if (milhares > 0) partes.push((milhares === 1 ? 'mil' : tresDigitos(milhares) + ' mil'));
    if (resto > 0) partes.push(tresDigitos(resto));
    return partes.join(' e ');
  }

  const inteiro = Math.floor(numero);
  const centavos = Math.round((numero - inteiro) * 100);
  const usaMilhao = inteiro >= 1000000 && inteiro % 1000000 === 0;
  let texto = inteiroPorExtenso(inteiro) + (usaMilhao ? ' de' : '') + (inteiro === 1 ? ' real' : ' reais');
  if (centavos > 0) {
    texto += ' e ' + inteiroPorExtenso(centavos) + (centavos === 1 ? ' centavo' : ' centavos');
  }
  return texto;
}

function formatarReais(valorStr) {
  if (!valorStr) return '';
  let limpo = String(valorStr).replace(/[^\d,.]/g, '').trim();
  limpo = limpo.replace(/\.(?=\d{3}(,|$))/g, '');
  limpo = limpo.replace(',', '.');
  const numero = parseFloat(limpo);
  if (isNaN(numero)) return escapeHtml(valorStr);
  return numero.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function downloadAsWord(contentHtml, filename) {
  const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${filename}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>body{font-family:Calibri, Arial, sans-serif;} @page{margin:2.5cm;}</style>
</head><body>${contentHtml}</body></html>`;
  const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[\\/:*?"<>|]/g, '') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function showDocPreview(tituloDoc, contentHtml, lead) {
  const root = document.getElementById('docPreviewRoot');
  const nomeArquivo = tituloDoc + (lead && lead.nome ? ' - ' + lead.nome : '');
  root.innerHTML = `
    <div class="overlay" id="docPreviewOverlay">
      <div class="modal" style="max-width: 760px;">
        <div class="modal-header">
          <h2>${escapeHtml(tituloDoc)} — revise antes de baixar</h2>

        </div>
        <div class="modal-body" style="max-height:65vh; background:#f0eee9;">
          <div id="docPreviewContent" style="background:white; border:1px solid var(--border); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            ${contentHtml}
          </div>
        </div>
        <div class="modal-footer">
          <div class="left" style="font-size:11px; color:#9a9488; max-width:220px;">Revise o conteúdo acima. Se precisar corrigir algo, feche e ajuste os dados do lead.</div>
          <div class="right">
            <button class="btn btn-ghost" id="docPreviewWord">💾 Baixar em Word (.doc)</button>
            <button class="btn btn-gold" id="docPreviewPrint">🖨️ Imprimir / Salvar PDF</button>
          </div>
        </div>
      </div>
    </div>`;

  const closePreview = () => { root.innerHTML = ''; };
  document.getElementById('docPreviewClose').addEventListener('click', closePreview);
  document.getElementById('docPreviewOverlay').addEventListener('click', (e) => { if (e.target.id === 'docPreviewOverlay') closePreview(); });
  document.getElementById('docPreviewWord').addEventListener('click', () => downloadAsWord(contentHtml, nomeArquivo));

    const tituloOriginal = document.title;
    document.title = nomeArquivo;
    document.getElementById('printArea').innerHTML = contentHtml;
    window.print();
    setTimeout(() => { document.title = tituloOriginal; }, 1000);
  });
}

/* ---------- exportação (com identidade visual azul-marinho / dourado) ---------- */
function formatarHistoricoObservacoes(notas) {
  if (!notas || notas.length === 0) return '';
  const ordenadas = [...notas].sort((a, b) => new Date(b.data) - new Date(a.data));
  return ordenadas.map(n => {
    const data = n.data ? new Date(n.data).toLocaleDateString('pt-BR') : '';
    const etapa = n.etapa ? ` (${n.etapa})` : '';
    return `${data}${etapa}: ${n.texto || ''}`;
  }).join('\n');
}

const XLS_NAVY = 'FF15253F';
const XLS_GOLD = 'FFC5A483';
const XLS_GOLD_DARK = 'FFA9835E';
const XLS_CREAM = 'FFF7F5F2';
const XLS_WHITE = 'FFFFFFFF';
const XLS_INK = 'FF2A2723';
const XLS_MUTED = 'FF7C7468';

function xlsHeaderRow(row, numCols) {
  row.eachCell({ includeEmpty: true }, (cell) => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_NAVY } };
    cell.font = { name: 'Calibri', bold: true, size: 11, color: { argb: XLS_WHITE } };
    cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
    cell.border = { bottom: { style: 'medium', color: { argb: XLS_GOLD } } };
  });
  row.height = 24;
}

function xlsZebra(ws, startRow, endRow, numCols) {
  for (let r = startRow; r <= endRow; r++) {
    const isOdd = (r - startRow) % 2 === 1;
    const row = ws.getRow(r);
    for (let c = 1; c <= numCols; c++) {
      const cell = row.getCell(c);
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isOdd ? XLS_CREAM : XLS_WHITE } };
      if (!cell.font) cell.font = { name: 'Calibri', size: 10.5, color: { argb: XLS_INK } };
      cell.alignment = Object.assign({ vertical: 'middle' }, cell.alignment || {});
    }
    row.height = 18;
  }
}

function xlsTitleRow(ws, rowNum, text, numCols) {
  ws.mergeCells(rowNum, 1, rowNum, numCols);
  const row = ws.getRow(rowNum);
  row.getCell(1).value = text;
  row.getCell(1).font = { name: 'Cambria', bold: true, size: 15, color: { argb: XLS_WHITE } };
  row.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  for (let c = 1; c <= numCols; c++) {
    row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_NAVY } };
  }
  row.height = 30;
}

function xlsSubtitleRow(ws, rowNum, text, numCols) {
  ws.mergeCells(rowNum, 1, rowNum, numCols);
  const row = ws.getRow(rowNum);
  row.getCell(1).value = text;
  row.getCell(1).font = { name: 'Calibri', italic: true, size: 10, color: { argb: XLS_MUTED } };
  row.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  row.height = 20;
}

function xlsSectionRow(ws, rowNum, text, numCols) {
  ws.mergeCells(rowNum, 1, rowNum, numCols);
  const row = ws.getRow(rowNum);
  row.getCell(1).value = text;
  row.getCell(1).font = { name: 'Calibri', bold: true, size: 11, color: { argb: XLS_NAVY } };
  row.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  for (let c = 1; c <= numCols; c++) {
    row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_GOLD } };
  }
  row.height = 22;
}

function xlsSetRow(row, values) {
  values.forEach((v, i) => { row.getCell(i + 1).value = v; });
  return row;
}

async function xlsDownload(workbook, filename) {
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
